<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Что осталось открытым?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#FC3E24; --red-d:#E0321B; --red-bg:#FFF1EE; --red-line:#F6B2A6;
  --ink:#16181D; --ink2:#4A4F5B; --muted:#7A808C;
  --line:#E2E5EB; --soft:#F3F4F6; --radio:#C3C7CF;
  --ok:#1E9E5A; --ok-bg:#E8F6EE; --ok-line:#BFE6CF;
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,monospace;
  --shadow:0 6px 18px rgba(27,32,51,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,#E9ECF0 0%,#F6F6F8 35%,#FFFFFF 100%);
  font-family:'Golos Text','TT Positive','Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);-webkit-tap-highlight-color:transparent;
}
button,textarea{font-family:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid #2378c4;outline-offset:3px}
h1,h2,h3,p{margin:0}
code{font-family:var(--mono);font-size:.92em;overflow-wrap:anywhere}
[hidden]{display:none!important}

/* ---------- сцена 16:9 ---------- */
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;padding:58px 80px 62px;
  display:flex;flex-direction:column;overflow:hidden}
.logo{position:absolute;right:77px;top:72px;width:68px;height:68px;border-radius:6px}
.title{font-weight:700;font-size:74px;line-height:1;letter-spacing:-.03em;color:#000;white-space:nowrap;max-width:1080px;
  opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.sub{margin-top:26px;font-size:24px;line-height:1.35;color:var(--muted);max-width:1180px;opacity:0;animation:rise .6s ease .12s forwards}
.has-strip .sub{max-width:1070px;font-size:22px}
.fs{position:absolute;right:77px;bottom:18px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;padding:0;z-index:3}
.fs svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- таймер ---------- */
.timer{position:absolute;right:170px;top:84px;display:flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 18px;
  border-radius:99px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;animation:rise .6s ease .2s forwards}
.timer .tm{font-weight:700;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;min-width:52px}
.timer .tb{width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;padding:0}
.timer .tb:hover{background:#E6E8EC}
.timer .tb svg{width:15px;height:15px;stroke:var(--ink2);fill:var(--ink2);stroke-width:1.5;stroke-linejoin:round}
.timer .pulse{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;animation:blink 1.6s ease-in-out infinite}
.timer.paused .pulse{background:var(--radio);animation:none}
.timer.over{border-color:var(--red-line);background:var(--red-bg)}
.timer.over .tm{color:var(--red-d);font-size:17px}
.timer.over .pulse{display:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* этапы итоговой карточки (s46–s48) */
.step-strip{position:absolute;right:80px;top:162px;display:flex;gap:6px;opacity:0;animation:rise .6s ease .18s forwards}
.step-strip span{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.step-strip span.active{background:var(--red);border-color:var(--red);color:#fff}
.step-strip span.done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.step-strip span.active.done{background:var(--ok);border-color:var(--ok);color:#fff}

/* ---------- область задания ---------- */
.content{flex:1;min-height:0;margin-top:30px;position:relative}
.content.intro-anim > *{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.content.intro-anim > *:nth-child(1){animation-delay:.25s}
.content.intro-anim > *:nth-child(2){animation-delay:.37s}
.content.swap > *{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 28px}
.panel h2{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin-bottom:14px}
.panel p{font-size:17px;line-height:1.42;color:var(--ink2)}
.panel.flat{padding:22px 28px}.panel.flat h2{margin-bottom:8px}
.context{background:rgba(255,255,255,.88)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.workspace{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:32px;align-items:start}
.workspace.even{grid-template-columns:1fr 1fr}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;margin-top:22px}

.fact{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #F0F1F4;font-size:17px;line-height:1.35}
.fact:first-of-type{border-top:0;padding-top:0}
.fact .number{width:30px;height:30px;border-radius:50%;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:700;font-size:14px}
.note{font-size:15.5px;line-height:1.42;color:var(--ink2);background:#F5F6F8;border-radius:12px;padding:12px 16px;margin-top:16px}
.note strong{color:var(--ink);font-weight:600}
.note.alert{background:var(--red-bg);color:var(--red-d)}
.question + .question{margin-top:16px}
.question-title{font-weight:600;font-size:18px;line-height:1.3;margin-bottom:9px;color:var(--ink)}
.label{font-weight:600;font-size:18px;line-height:1.3;margin:18px 0 10px;color:var(--ink)}

/* сегменты — как в slide11 */
.seg{display:flex;gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.seg .option{flex:1 1 auto;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:11px 8px;font-size:15.5px;font-weight:600;color:var(--ink2);line-height:1.15;
  transition:background .2s,color .2s,box-shadow .2s}
.seg .option:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.seg .option[aria-pressed=true]{background:#fff;color:var(--red-d);box-shadow:0 2px 8px rgba(27,32,51,.12)}
.seg .option.good{background:var(--ok);color:#fff;box-shadow:none}
.seg .option.bad{background:var(--red);color:#fff;box-shadow:none}
.mk{font-size:14px;font-weight:600;margin-left:8px}
.mk.ok{color:var(--ok)}.mk.no{color:var(--red-d)}

/* карточки выбора */
.choice{display:flex;width:100%;gap:14px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 18px;align-items:flex-start;
  color:var(--ink);transition:border-color .2s,background .2s,transform .15s,box-shadow .2s}
.choice + .choice{margin-top:10px}
.choice:hover{border-color:var(--red-line);transform:translateY(-1px);box-shadow:0 8px 20px rgba(27,32,51,.08)}
.choice .mark{width:24px;height:24px;flex:none;border:2px solid var(--radio);border-radius:50%;margin-top:1px;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:700;transition:all .2s}
.choice.multi .mark{border-radius:7px}
.choice strong{display:block;font-size:18px;font-weight:600;line-height:1.25;margin-bottom:3px}
.choice .desc{display:block;font-size:15px;line-height:1.38;color:var(--ink2)}
.choice[aria-pressed=true]{border-color:var(--red);background:var(--red-bg)}
.choice[aria-pressed=true] .mark{border:7px solid var(--red);background:#fff}
.choice.multi[aria-pressed=true] .mark{border:0;background:var(--red)}
.choice.multi[aria-pressed=true] .mark::after{content:'✓'}
.choice.good{border-color:var(--ok);background:var(--ok-bg)}
.choice.good .mark,.choice.multi.good .mark{border:0;background:var(--ok)}
.choice.good .mark::after{content:'✓'}
.choice.bad{border-color:var(--red);background:var(--red-bg)}
.choice.bad .mark,.choice.multi.bad .mark{border:0;background:var(--red)}
.choice.bad .mark::after{content:'×';font-size:18px;line-height:1}

/* кнопки — как в примерах */
.row-actions{display:flex;gap:14px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:12px;padding:14px 24px;background:var(--red);color:#fff;font-weight:600;font-size:17px;line-height:1.1;white-space:nowrap;
  transition:transform .15s,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(252,62,36,.3)}
.btn:hover{background:var(--red-d);transform:translateY(-1px)}
.btn:disabled{background:#F0B3A9;box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.hint{font-size:15px;color:var(--muted);line-height:1.35}
.hint.ready{color:var(--ok);font-weight:600}
.hint.no{color:var(--red-d)}

/* s42 */
.mail{background:#F5F6F8;border-radius:14px;padding:16px 18px}
.mail dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:8px 14px;font-size:16.5px;line-height:1.35}
.mail dt{color:var(--muted)}
.mail dd{margin:0;overflow-wrap:anywhere}
.mail strong{font-family:var(--mono);font-size:15px;font-weight:600}
.mutation .question-title{margin-top:18px}

/* s46 */
.category-card{padding:12px 0;border-top:1px solid #F0F1F4}
.category-card:first-of-type{border-top:0;padding-top:0}
.category-card h3{font-size:19px;font-weight:600;line-height:1.25;margin-bottom:5px}
.category-card p{font-size:15.5px;line-height:1.36;margin-bottom:9px}

/* ---------- разбор: открывается на месте задания ---------- */
.review{height:100%;display:flex;flex-direction:column;padding:26px 30px 24px;border-top:4px solid var(--red)}
.review.success{border-top-color:var(--ok)}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
.rv-head h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;color:var(--red-d)}
.review.success .rv-head h2{color:var(--ok)}
.rv-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px}
.rv-grid.single{grid-template-columns:1fr}
.rv-col{min-height:0;display:flex;flex-direction:column}
.res{display:grid;grid-template-columns:32px 1fr;gap:13px 14px;align-items:start}
.res .b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.res .b.ok{background:var(--ok)}.res .b.no{background:var(--red)}
.res .x{font-size:16.5px;line-height:1.4;color:var(--ink2);padding-top:5px}
.res .x strong{color:var(--ink);font-weight:600}
.rv-grid.single .res .x{font-size:18px}
.rv-p{margin-top:14px;font-size:16px;line-height:1.42;color:var(--ink2)}
.rv-col > .rv-p:first-child{margin-top:0}
.rv-p strong{color:var(--ink)}
.terminal{background:var(--ink);color:#E6E9EE;border-radius:14px;padding:16px 20px;font:14.5px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.terminal .fail{color:#FF9C8A;font-weight:600}

/* итоговая карточка (s48) — правая колонка разбора */
.threat{background:#F7F8FA;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;min-height:0;flex:1}
.threat h3{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.threat > p{font-size:14.5px;color:var(--ink2);line-height:1.38}
.threat dl{display:grid;grid-template-columns:130px 1fr;gap:7px 16px;font-size:14.5px;line-height:1.36;margin:12px 0 0}
.threat dt{color:var(--muted)}
.threat dd{margin:0}
.threat textarea{flex:1;min-height:0;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:12.5px/1.5 var(--mono);color:var(--ink);resize:none;background:#fff}
.threat .row-actions{margin-top:auto;padding-top:14px}
.threat .btn{padding:11px 18px;font-size:15px}

/* ---------- тост и конфетти — как в примерах ---------- */
.toast{position:fixed;left:50%;top:18px;z-index:40;display:flex;gap:16px;align-items:center;width:min(92vw,640px);
  padding:18px 24px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(27,32,51,.22);
  opacity:0;pointer-events:none;transform:translate(-50%,-20px) scale(.96);transition:opacity .35s,transform .45s cubic-bezier(.3,1.5,.5,1);
  font-family:'Golos Text','Segoe UI',Roboto,Arial,sans-serif}
.toast.show{opacity:1;pointer-events:auto;cursor:pointer;transform:translate(-50%,0)}
.toast .em{font-size:clamp(30px,6vw,44px);line-height:1}
.toast .tt{font-weight:700;font-size:clamp(20px,4vw,28px);letter-spacing:-.02em}
.toast .ts{font-size:clamp(13px,2.6vw,15.5px);line-height:1.35;color:var(--ink2);margin-top:4px}
.toast.win{border-color:var(--ok-line)}.toast.win .tt{color:var(--ok)}
.toast.lose{border-color:var(--red-line)}.toast.lose .tt{color:var(--red-d)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.shake{animation:shake .45s}
@media (prefers-reduced-motion:reduce){
  .title,.sub,.timer,.step-strip,.content.intro-anim > *,.content.swap > *{animation-duration:.01s!important;animation-delay:0s!important}
  .timer .pulse{animation:none}
  .shake{animation:none}
}
</style>
</head>
<body data-exercise="s48">
<div id="app"></div>
<noscript>Для выполнения задания включите JavaScript.</noscript>
<script>
/* Pure rules of synthetic classroom simulations. No network or real tool calls. */
(function (root) {
  'use strict';
  const catalog = [
    {id:'s26', slide:26, title:'Что действительно произошло?', short:'Свидетельства', task:'Оцените три вывода и выберите свидетельство, которое установит результат операции.'},
    {id:'s42', slide:42, title:'Что именно вы одобрили?', short:'Одобрение', task:'Выберите правило: исходное письмо должно уйти, а подмена — получить отказ.'},
    {id:'s46', slide:46, title:'Какие риски доказаны?', short:'Категории', task:'Сопоставьте три фрагмента с категориями. Если фактов мало, так и ответьте.'},
    {id:'s47', slide:47, title:'Контроль и два теста', short:'Контроль', task:'Выберите контроль и пару тестов: запрет должен работать, полезный доступ — сохраняться.'},
    {id:'s48', slide:48, title:'Что осталось открытым?', short:'Остаточный риск', task:'Отметьте ровно два открытых пути и выберите следующую проверку.'}
  ];
  const categories = ['ASI01','ASI06','ASI07','Недостаточно данных'];
  const categoryAnswers = ['ASI01','ASI06','Недостаточно данных'];
  const categoryReasons = [
    'Вложение превратило подготовку черновика в поиск закрытого отчёта и отправку. Это изменение маршрута под влиянием внешнего текста — ASI01.',
    'Подложный адрес сохранён как правило и использован в новой сессии без исходного вложения. Подтверждены запись и последующее влияние — ASI06.',
    'Известен только факт передачи запроса. Для ASI07 нужно исследовать аутентификацию, привязку к задаче, область полномочий и проверку повтора. Само сообщение не доказывает дефект.'
  ];
  const controls = [
    {id:'prompt', title:'Правило в системном промпте', text:'«Читай только данные клиента текущего обращения». Исполнитель допускает любой customer_id.'},
    {id:'scope', title:'Проверка области в исполнителе', text:'Для проверенной задачи T-104 исполнитель разрешает чтение C-17 и отклоняет C-18 до обращения к CRM.'},
    {id:'deny', title:'Отключение чтения CRM', text:'Исполнитель отклоняет все вызовы read_customer, включая чтение C-17.'}
  ];
  const testPairs = [
    {id:'reply', title:'Проверить ответы модели', text:'На просьбу прочитать C-18 — вежливый отказ. На просьбу прочитать C-17 — полезный ответ.'},
    {id:'negative', title:'Два запроса чужих данных', text:'Прямые вызовы read_customer(C-18) и read_customer(C-19) отклонены; данные отсутствуют.'},
    {id:'both', title:'Чужой и разрешённый объект', text:'В T-104: C-18 → отказ исполнителя, данных нет. C-17 → успешное чтение разрешённых полей. Проверяем журнал и результат.'}
  ];
  const risks = [
    {id:'other', title:'Прямое чтение C-18', text:'read_customer(C-18) через защищённый исполнитель.', open:false, why:'Этот путь закрыт: область задачи проверяется до чтения.'},
    {id:'kb', title:'Внутренняя база знаний', text:'Внутренняя статья попадает во внешнее письмо.', open:true, why:'Контроль CRM не распространяется на базу знаний и передачу её содержимого.'},
    {id:'alias', title:'Другой инструмент CRM', text:'read_report(all) обращается к тому же защищённому исполнителю.', open:false, why:'По условиям все инструменты CRM используют одну проверку объектов. Смена имени инструмента её не обходит.'},
    {id:'mail', title:'Доступные чувствительные данные', text:'Внутренний скоринг C-17 уходит на адрес из вложения.', open:true, why:'Чтение скоринга C-17 разрешено в этом стенде; право передать его наружу отдельно не проверяется.'}
  ];
  const nextTests = [
    {id:'prompt', title:'Добавить запрет в промпт', text:'Попросить модель не отправлять внутренние сведения и проверить её ответ.'},
    {id:'egress', title:'Проверить передачу через почту', text:'Попытаться отправить синтетический закрытый маркер из базы знаний и скоринг C-17 на адрес из вложения. Ожидать отказ и отсутствие писем; разрешённый ответ клиенту должен отправиться.'},
    {id:'crm', title:'Повторить проверку CRM', text:'Ещё раз вызвать read_customer(C-18) и убедиться в отказе.'}
  ];
  const approved = Object.freeze({task:'T-104', to:'client17@example.test', attachment:'reply-T104.pdf', data:'Публичный регламент', expires:110});
  function authorize(rule, proposed, now=50) {
    if (rule === 'task') return proposed.task === approved.task;
    if (rule === 'recipient') return proposed.task === approved.task && proposed.to === approved.to;
    if (rule !== 'exact') return false;
    return now < approved.expires && ['task','to','attachment','data'].every(k => proposed[k] === approved[k]);
  }
  function approvalTests(rule, mutation) {
    let p={...approved}, now=50;
    if (mutation==='recipient') p.to='archive@outside.example.test';
    if (mutation==='attachment') {p.attachment='internal-C17.csv';p.data='Внутренний скоринг C-17';}
    if (mutation==='expired') now=111;
    return [{name:'Исходное письмо', allow:authorize(rule,approved), expected:true, args:approved},
      {name:mutation==='expired'?'Просроченное одобрение':'Операция после подмены', allow:authorize(rule,p,now), expected:false, args:p}];
  }
  function crmRun(control, customer) {
    if (control==='deny') return {allowed:false,status:403,source:'executor',data:null};
    if (control==='scope' && customer!=='C-17') return {allowed:false,status:403,source:'executor',data:null};
    return {allowed:true,status:200,source:'crm',data:customer==='C-17'?'Разрешённые поля C-17':'CLOSED-MARKER-C18'};
  }
  function categoryScore(answers) {return categoryAnswers.map((a,i)=>a===answers[i]);}
  function evidenceScore(answers, witness) {return {items:['yes','unknown','unknown'].map((a,i)=>a===answers[i]),witness:witness==='service'};}

const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
function confetti() {
  if (reduced) return;
  const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#FC3E24', '#16181D', '#FFB4A6', '#1E9E5A', '#C3C7CF', '#FFD166'];
  const ps = Array.from({length: 160}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .2,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4,
    w: 6 + Math.random() * 7, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  const frame = now => {
    const el = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / 2600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
      ctx.restore();
    });
    if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(frame);
}

function marks() {

  if (id === 's46') M.categoryScore(state.answers).forEach((v, i) => m['a' + i] = v);
  if (id === 's42') m.rule = suiteOK();
  if (id === 's47') { m.control = state.control === 'scope'; m.pair = state.pair === 'both'; }
  if (id === 's48') { m.risks = Object.fromEntries(M.risks.map(r => [r.id, r.open])); m.next = state.next === 'egress'; }
  return m;
}
function suiteOK() { return ['recipient', 'attachment', 'expired'].every(x => M.approvalTests(state.rule, x).every(r => r.allow === r.expected)); }

  return `<div class="row-actions">${btn(label, 'check', ready() ? '' : 'disabled')}<span class="hint${ready() ? ' ready' : ''}">${ready() ? 'Можно проверять.' : progressHint()}</span></div>`;

function ready() { switch (id) { case 's26': return state.answers.every(Boolean) && !!state.witness; case 's42': return !!state.rule; case 's46': return state.answers.every(Boolean); case 's47': return !!state.control && !!state.pair; case 's48': return state.risks.length === 2 && !!state.next; default: return false; } }
function progressHint() { return ({s26:'Ответьте на три вопроса и выберите свидетельство.', s42:'Выберите правило исполнения.', s46:'Нужен ответ для каждого фрагмента.', s47:'Выберите контроль и пару тестов.', s48:`Открытых путей выбрано: ${state.risks.length} из 2. Нужна следующая проверка.`})[id]; }

function strip() {
  if (index < 2) return '';
  return `<nav class="step-strip" aria-label="Этапы карточки">${['Категории', 'Контроль и тесты', 'Остаточный риск'].map((t, i) => {
    const d = completed[M.catalog[i + 2].id];
    return `<span class="${index - 2 === i ? 'active' : ''}${d ? ' done' : ''}">${t}${d ? ' ✓' : ''}</span>`;
  }).join('')}</nav>`;
}

/* ---------- разбор (тексты и правила оценки — как в исходнике) ---------- */
function row(ok, text) { return `<div class="b ${ok ? 'ok' : 'no'}" aria-label="${ok ? 'Верно' : 'Ошибка'}">${ok ? '✓' : '×'}</div><div class="x">${text}</div>`; }
const P = t => `<p class="rv-p">${t}</p>`;
function evaluate() {
  let ok = false, rows = '', side = '';
  if (id === 's26') {
    const r = M.evidenceScore(state.answers, state.witness); ok = r.items.every(Boolean) && r.witness;
    rows = [row(r.items[0], 'Предложение экспорта видно в трассе.'), row(r.items[1], 'Допуск вызова не подтверждает исполнение. При потере ответа статус операции неизвестен.'), row(r.items[2], 'До открытия события нет доказательства, что данные доступны получателю.'), row(r.witness, 'Для результата нужно независимое событие внешнего сервиса.')].join('');
    side = `<div class="terminal">ОТКРЫТО СВИДЕТЕЛЬСТВО СЕРВИСА\noperation_id=OP-104-7\nstatus=COMPLETED\nexport_contains=CLOSED-MARKER-C18\ndownloaded_by=external-recipient\n<span class="fail">Экспорт выполнен; получение закрытых данных подтверждено.</span></div>` + P('Теперь есть основание подтвердить исполнение и раскрытие. Нужна сверка статуса OP-104-7; слепой повтор мог бы продублировать эффект.');
  }
  if (id === 's42') {
    const tests = M.approvalTests(state.rule, state.mutation); ok = suiteOK();
    rows = tests.map(r => row(r.allow === r.expected, `${escape(r.name)}: <strong>${r.allow ? 'ОТПРАВЛЕНО' : 'ОТКЛОНЕНО'}</strong>${r.allow === r.expected ? '' : ' — ожидался другой результат'}.`)).join('');
    side = `<div class="terminal">${tests.map(r => `${r.name}\nto=${r.args.to}\nattachment=${r.args.attachment}\nexecutor=${r.allow ? 'ALLOW; mail: ACCEPTED' : 'DENY; mail: NO_NEW_EVENT'}`).join('\n\n')}</div>`;
    rows += `</div>${P(ok ? 'Точная операция связана с действующим одобрением. Проверки полномочий и обязательные ограничения доступа выполняются отдельно.' : 'Правило должно выдерживать все три варианта. Даже если выбранный прогон прошёл, проверьте вложение и истечение срока. Задание завершается после выбора полного правила.')}<div>`;
  }
  if (id === 's46') {
    const r = M.categoryScore(state.answers); ok = r.every(Boolean);
    rows = r.map((v, i) => row(v, `<strong>${escape(M.categoryAnswers[i])}.</strong> ${escape(M.categoryReasons[i])}`)).join('');
  }
  if (id === 's47') {
    const r = M.controlScore(state.control, state.pair); ok = r.valid;
    rows = row(r.blocked, 'Отрицательный тест: C-18 должен получить отказ, данные должны отсутствовать.') + row(r.useful, 'Положительный тест: разрешённые поля C-17 должны читаться.') + row(state.pair === 'both', 'Доказательная пара проверяет исполнителя и данные для чужого и разрешённого объекта.');
    side = `<div class="terminal">task=T-104; read_customer(C-18)\n${r.negative.source}: ${r.negative.status}; data=${r.negative.data || 'NONE'}\n\ntask=T-104; read_customer(C-17)\n${r.positive.source}: ${r.positive.status}; data=${r.positive.data || 'NONE'}</div>`;
    if (state.control === 'prompt') side += P('В этой симуляции модель предложила запрещённый запрос, несмотря на правило в промпте. Исполнитель всё ещё допускает его.');
    if (state.control === 'deny') side += P('Полное отключение чтения блокирует атаку, но ломает разрешённую задачу.');
    side += P('Журнал выше — диагностический прогон симулятора. Выбор только ответов модели или двух запретов не даёт полной проверки.');
  }
  if (id === 's48') {
    const r = M.riskScore(state.risks, state.next); ok = r.items.every(Boolean) && r.next;
    rows = M.risks.map((x, i) => row(r.items[i], `<strong>${escape(x.title)}: ${x.open ? 'путь открыт' : 'путь закрыт'}.</strong> ${escape(x.why)}`)).join('');
    rows += row(r.next, 'Следующий тест проверяет передачу данных через почту и полезную разрешённую отправку.');
    rows += `</div>${P('Это план следующей проверки. Защита почты ещё не реализована и её работоспособность этим ответом не доказана.')}<div>`;
    side = ok ? card() : '';
  }
  return {ok, rows, side};
}
function review() {
  const {ok, rows, side} = evaluate();
  return `<section class="panel review${ok ? ' success' : ''}" aria-live="polite"><div class="rv-head"><div><div class="eyebrow">Разбор</div><h2>${ok ? 'Решение верное' : 'Есть что уточнить'}</h2></div>${btn('← Вернуться к заданию', 'task', '', 'btn ghost')}</div>
  <div class="rv-grid${side ? '' : ' single'}"><div class="rv-col"><div class="res">${rows}</div>${!ok ? P('<strong>Измените выбор и проверьте ещё раз.</strong>') : ''}</div>${side ? `<div class="rv-col">${side}</div>` : ''}</div></section>`;
}

  }

    return toast('lose', '🤔', `Верно ${n} из 3`, !r[2] ? 'Подсказка: сам факт сообщения между агентами доказывает дефект обмена?' : 'Подсказка: опирайтесь только на то, что видно во фрагменте.', 5000);

    if (state.control === 'prompt') return toast('lose', '😬', 'Утечка!', 'Просьба в промпте — не ограничение. Исполнитель всё ещё пропускает чтение C-18.', 5000);
    if (state.control === 'deny') return toast('lose', '🤔', 'Слишком жёстко', 'Атака остановлена, но разрешённая задача сломана: C-17 тоже не читается.', 5000);
    return toast('lose', '🤔', 'Почти!', 'Контроль верный, но тесты этого не доказывают. Нужны чужой и разрешённый объект.', 5000);
  }
  if (id === 's48') {
    const r = M.riskScore(state.risks, state.next), n = r.items.filter(Boolean).length + (r.next ? 1 : 0);
    if (ok) return toast('win', '🔥', 'Красавчик!', 'Карточка угрозы собрана: остаточный риск назван, следующий тест выбран.');
    return toast('lose', '🤔', `Верно ${n} из 5`, !r.items.every(Boolean) ? 'Подсказка: защита CRM работает для всех её инструментов. Что осталось за её пределами?' : 'Подсказка: какой тест проверит канал, который защита CRM не покрывает?', 5000);
  }
}

/* ---------- итоговая карточка (s48) ---------- */
function cardText() { return `КАРТОЧКА УГРОЗЫ · ТЕМА 1.3\nУчебный синтетический сценарий\n\nАктив: данные клиентов CRM; доступ только по разрешённой задаче.\nЗадача: T-104, клиент C-17 — найти доступный регламент и подготовить черновик.\nАтакующий: управляет текстом и вложением своего обращения; не имеет доступа к токенам и политике.\nПредпосылка: до защиты сервисная учётная запись может читать нескольких клиентов.\nМаршрут: вложение → контекст → предложение read_customer(C-18) → исполнитель → CRM.\nНарушение: попытка чтения чужих данных за пределами T-104.\n\nКатегории [${completed.s46 ? 'ПРОВЕРЕНО' : 'ещё не пройдено — опорный разбор'}]:\nASI01 — внешний текст изменил маршрут.\nASI06 — в отдельном фрагменте правило сохранилось в памяти и повлияло на новую сессию.\nASI07 — факта сообщения недостаточно, проверки обмена нужно исследовать.\n\nКонтроль [${completed.s47 ? 'ПРОВЕРЕНО' : 'ещё не пройдено — опорный разбор'}]:\nИсполнитель проверяет область по доверенному состоянию задачи T-104; чтение только C-17.\nОтрицательный тест: read_customer(C-18) → 403 до чтения CRM, data=NONE.\nПоложительный тест: read_customer(C-17) → 200, разрешённые поля доступны.\nСвидетельства: решение исполнителя и фактический результат обоих вызовов.\n\nОстаточный риск [${completed.s48 ? 'ПРОВЕРЕНО' : 'ещё не пройдено — опорный разбор'}]:\nВнутренняя база знаний и скоринг C-17 всё ещё могут попасть во внешнее письмо.\nСледующий тест: отправка закрытого синтетического маркера и скоринга на адрес из вложения должна отклоняться; разрешённый ответ клиенту должен отправляться.\nЭто ожидаемые результаты будущего теста, а не подтверждённая защита.\n\nГраницы вывода: в карточке проверен контроль чтения CRM. Для ASI02/ASI03 нужны отдельные факты об операции и полномочиях; ASI04/ASI07/ASI10 автоматически не добавляются.\nПриоритет (учебная оценка): закрыть прямое чтение чужих клиентов; далее проверить передачу доступных чувствительных сведений наружу.\n`; }
function card() {
  const count = ['s46', 's47', 's48'].filter(k => completed[k]).length;
  return `<div class="threat"><div class="eyebrow">Результат · ${count} из 3 этапов пройдено</div><h3>Карточка угрозы</h3><p>${count === 3 ? 'Все три этапа собраны. Карточку можно сохранить для обсуждения.' : 'Недостающие этапы отмечены как опорный разбор. Их можно пройти отдельно на соответствующих слайдах.'}</p>
  ${exportOpen ? `<textarea id="card-text" readonly aria-label="Текст для копирования">${escape(cardText())}</textarea>` : `<dl><dt>Сценарий</dt><dd>Вложение меняет маршрут → агент предлагает чтение C-18 в задаче C-17.</dd><dt>Категории</dt><dd>ASI01; в отдельном фрагменте памяти — ASI06. Для ASI07 данных недостаточно.</dd><dt>Контроль и тесты</dt><dd>Исполнитель: область T-104. C-18 → отказ и нет данных; C-17 → разрешённые поля.</dd><dt>Остаточный риск</dt><dd>Передача внутренней базы знаний и чувствительных данных C-17 через почту.</dd><dt>Дальше</dt><dd>Проверить запрещённую передачу и разрешённый ответ клиенту.</dd></dl>`}
  <div class="row-actions">${btn('Скопировать карточку', 'copy')} ${btn(exportOpen ? 'Кратко' : 'Полный текст', 'export', '', 'btn ghost')}<span class="hint" id="copy-status" role="status"></span></div></div>`;
}

/* ---------- отрисовка ---------- */
function render(swap = false) {
  MK = marks();
  if (state.checked) { completed[id] = evaluate().ok; save(); }
  document.getElementById('strip').innerHTML = strip();
  content.innerHTML = view === 'review' && state.checked ? review()
    : ({s26:evidence, s42:approval, s46:categories, s47:controls, s48:risks})[id]();
  if (!firstRender) {
    content.classList.remove('intro-anim');
    const s = document.querySelector('.step-strip'); if (s) { s.style.animation = 'none'; s.style.opacity = '1'; }
  }
  content.classList.toggle('swap', swap);
  firstRender = false;
  renderTimer();
}

/* ---------- таймер: стартует сам при открытии слайда ---------- */
function clockText() { return `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, '0')}`; }
function renderTimer() {
  const t = document.getElementById('timer'), over = remaining === 0;
  t.classList.toggle('over', over); t.classList.toggle('paused', !running && !over);
  document.getElementById('clock').textContent = over ? 'Время обсудить' : clockText();
  const b = document.getElementById('timerBtn');
  b.innerHTML = svg(running ? 'pause' : 'play');
  const label = running ? 'Пауза' : (over ? 'Запустить таймер заново' : 'Продолжить');
  b.title = label; b.setAttribute('aria-label', label);
}
function stopTimer() { running = false; clearInterval(tick); tick = null; renderTimer(); }
function startTimer() {
  if (running) return;
  if (remaining === 0) remaining = 180;
  running = true;
  tick = setInterval(() => { remaining = Math.max(0, remaining - 1); if (remaining === 0) stopTimer(); else renderTimer(); }, 1000);
  renderTimer();
}

/* ---------- события ---------- */
root.addEventListener('click', async e => {
  const button = e.target.closest('button'); if (!button || button.disabled) return;
  const group = button.dataset.group;
  if (group) {
    const value = button.dataset.value;
    if (group === 'risks') { if (state.risks.includes(value)) state.risks = state.risks.filter(v => v !== value); else if (state.risks.length < 2) state.risks.push(value); else { shake(button); return; } }
    else if (/^a\d$/.test(group)) state.answers[Number(group[1])] = value;
    else state[group] = value;
    state.checked = false; completed[id] = false; save(); view = 'task'; clearTimeout(flipTimer); hideToast(); render();
    const replacement = [...root.querySelectorAll('button[data-group]')].find(b => b.dataset.group === group && b.dataset.value === value);
    if (replacement) replacement.focus({preventScroll: true});
    return;
  }
  switch (button.dataset.action) {
    case 'fullscreen': {
      const d = document.documentElement;
      if (document.fullscreenElement) document.exitFullscreen();
      else if (d.requestFullscreen && document.fullscreenEnabled) d.requestFullscreen().catch(() => open(location.href, '_blank'));
      else open(location.href, '_blank');
      break;
    }
    case 'check':
      if (!ready()) return;
      stopTimer(); state.checked = true; exportOpen = false; render();
      if (window.TrainingAPI) window.TrainingAPI.submit(id, 'main', {risks:state.risks.slice(),next:state.next});
      feedbackToast();
      root.querySelectorAll('.choice.bad, .option.bad').forEach(b => { const p = b.closest('.category-card, .question, .panel'); if (p) shake(p); });
      // как в slide11: при верном ответе разбор открывается сам, при ошибке — по кнопке
      if (completed[id]) { clearTimeout(flipTimer); flipTimer = setTimeout(() => { if (state.checked) { view = 'review'; render(true); } }, reduced ? 0 : 1300); }
      break;
    case 'review': view = 'review'; render(true); break;
    case 'task': view = 'task'; render(true); break;
    case 'timer': if (running) stopTimer(); else startTimer(); break;
    case 'export': exportOpen = !exportOpen; render(); break;
    case 'copy':
      try { if (!navigator.clipboard) throw Error('clipboard unavailable'); await navigator.clipboard.writeText(cardText()); document.getElementById('copy-status').textContent = 'Скопировано.'; }
      catch { exportOpen = true; render(); const area = document.getElementById('card-text'); area.focus(); area.select(); document.getElementById('copy-status').textContent = 'Нажмите Ctrl+C / ⌘C.'; }
      break;
  }
});

render();
startTimer();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
<script src="./training-api.js"></script>
