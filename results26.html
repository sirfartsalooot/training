'use strict';
const CFG={"slide": "s26", "title": "Что действительно произошло?", "desc": "Свидетельства и результат операции", "fields": [["a0", "Предложение экспорта"], ["a1", "Исполнение операции"], ["a2", "Получение данных"], ["witness", "Решающее свидетельство"]], "takeaway": "Важно различать предложенное действие, фактический вызов инструмента и доказанное получение данных."};
const API='https://training-votes-api.skovaleva.workers.dev',SESSION='training-001',REFRESH_MS=5000;
const local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const params=new URLSearchParams(location.search),base=(local&&params.get('api'))||API,sid=params.get('sessionId')||SESSION;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fit(){const k=Math.min(innerWidth/1600,innerHeight/900);$('stage').style.transform=`translate(${(innerWidth-1600*k)/2}px,${(innerHeight-900*k)/2}px) scale(${k})`;}
addEventListener('resize',fit);fit();$('stage').classList.add('ready');
let busy=false,hasData=false;
function render(d){const u=d.units?.main||{participants:0,passed:0,partial:0,failed:0};const answered=Number(u.participants||0),passed=Number(u.passed||0);const total=Math.max(Number(d.sessionParticipants||0),answered);
 const fraction=total?`${passed} / ${total}`:'0 / 0';
 $('hero').innerHTML=`<div class="num ${total?'':'wait'}">${esc(fraction)}</div><div class="lbl">слушателей решили задание полностью правильно</div><p class="sub">${total?Math.round(100*passed/total)+'% от всех участников сессии':'Пока нет зарегистрированных участников'} · ${answered} отправили решение</p><div class="hero-rule">С ошибками: <strong>${Math.max(0,answered-passed)}</strong> · Не отправили: <strong>${Math.max(0,total-answered)}</strong></div>`;
 const items=CFG.fields.map(([id,label])=>{const q=d.questions?.[id];return {id,label,attempts:Number(q?.attempts||0),mistakes:Number(q?.mistakes||0)};}).sort((a,b)=>b.mistakes-a.mistakes);
 const max=Math.max(1,...items.map(x=>x.mistakes));
 $('chart').innerHTML=`<h2>Где чаще всего ошибались</h2><p class="note">Количество участников с неверным ответом на каждый пункт. Сортировка по ошибкам.</p><div class="rows">${items.map((x,i)=>`<div class="row ${i===0&&x.mistakes?'most':''} ${x.attempts?'':'none'}"><span class="name">${esc(x.label)}</span><span class="bar"><b style="width:${100*x.mistakes/max}%"></b></span><span class="val">${x.attempts?x.mistakes:'—'} <small>${x.attempts?'из '+x.attempts:''}</small></span></div>`).join('')}</div>`;
 const worst=items[0];$('takeaway').textContent=worst&&worst.mistakes?`Чаще всего ошибались: ${worst.label.toLowerCase()} (${worst.mistakes} из ${worst.attempts}).`:`${CFG.takeaway}`;
}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch(base.replace(/\/$/,'')+'/api/results?sessionId='+encodeURIComponent(sid)+'&slideId='+encodeURIComponent(CFG.slide),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.sessionId!==sid||d.slideId!==CFG.slide||!d.units||typeof d.sessionParticipants!=='number'||!d.questions)throw Error('API требует обновления Worker (sessionParticipants, questions)');render(d);hasData=true;$('live').className='live ok';$('live').innerHTML='<i></i><span>Обновлено '+new Date().toLocaleTimeString('ru-RU')+'</span>';}catch(e){console.error(e);$('live').className='live bad';$('live').innerHTML='<i></i><span>'+(hasData?'Нет связи · последние данные':'Нет связи · обновите Worker')+'</span>';}finally{busy=false;}}
render({units:{},sessionParticipants:0,questions:{}});refresh();setInterval(()=>{if(!document.hidden)refresh()},REFRESH_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
