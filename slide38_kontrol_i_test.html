<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Контроль и тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Shared look of the "Тема 1.1" deck: tokens, stage, cards, buttons, toast */
:root{
  --red:#FC3E24; --red-d:#E0321B; --red-bg:#FFF1EE; --red-line:#F6B2A6;
  --ink:#16181D; --ink2:#4A4F5B; --muted:#7A808C;
  --line:#E2E5EB; --soft:#F3F4F6; --radio:#C3C7CF;
  --ok:#1E9E5A; --ok-bg:#E8F6EE; --warn:#E39A1B; --bad:#9AA0AA;
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,monospace;
  --shadow:0 6px 18px rgba(27,32,51,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  overflow:hidden;
  background:linear-gradient(180deg,#E9ECF0 0%,#F6F6F8 35%,#FFFFFF 100%);
  font-family:'Golos Text','TT Positive','Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);-webkit-tap-highlight-color:transparent;
}
body.port{overflow-x:hidden;overflow-y:auto}
#fit{position:relative;width:100%;height:100%}
body.port{background:#fff linear-gradient(180deg,#E9ECF0 0,#FFFFFF 700px) no-repeat}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:58px 80px 0}
#stage.port{padding:62px 30px 40px}
.glass{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none;z-index:0;
  opacity:0;animation:fade 1.2s ease .1s forwards}
#stage.port .glass{width:900px;height:506px;opacity:.7}
#stage > *:not(.glass){position:relative;z-index:1}
.logo{position:absolute!important;right:77px;top:72px;width:68px;height:68px;border-radius:6px}
#stage.port .logo{right:30px;top:60px;width:62px;height:62px}
.title{margin:0;font-weight:700;font-size:74px;line-height:1;letter-spacing:-.03em;color:#000;white-space:nowrap;
  opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
#stage.port .title{font-size:52px;white-space:normal;max-width:740px}
.sub{margin:44px 0 0;font-size:24px;line-height:1.35;color:var(--muted);opacity:0;animation:rise .6s ease .12s forwards}
#stage.port .sub{margin-top:26px;font-size:24px}
.num{position:absolute!important;right:77px;bottom:30px;font-size:15px;color:var(--muted)}
#stage.port .num{bottom:14px;right:30px}
.fs{position:absolute!important;right:118px;bottom:24px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;cursor:pointer;padding:0}
#stage.port .fs{right:auto;left:30px;bottom:8px}
.fs svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.ic{flex:none;display:grid;place-items:center;border-radius:14px;background:var(--red)}
.ic svg{width:56%;height:56%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
#stage.port .eyebrow{font-size:16px}

.btn{border:0;border-radius:12px;padding:14px 26px;background:var(--red);color:#fff;font-family:inherit;font-weight:600;font-size:17px;line-height:1.1;
  cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(252,62,36,.3)}
.btn:hover{background:var(--red-d);transform:translateY(-1px)}
.btn:disabled{background:#F0B3A9;box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
#stage.port .btn{font-size:22px;padding:18px 26px}

.anim-rise{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .45s}

/* toast lives outside the stage, in real pixels */
.toast{position:fixed;left:50%;top:18px;z-index:40;display:flex;gap:16px;align-items:center;width:min(92vw,640px);
  padding:18px 24px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(27,32,51,.22);
  opacity:0;pointer-events:none;transform:translate(-50%,-20px) scale(.96);transition:opacity .35s,transform .45s cubic-bezier(.3,1.5,.5,1);
  font-family:'Golos Text','Segoe UI',Roboto,Arial,sans-serif}
.toast.show{opacity:1;pointer-events:auto;cursor:pointer;transform:translate(-50%,0)}
.toast .em{font-size:clamp(30px,6vw,44px);line-height:1}
.toast .tt{font-weight:700;font-size:clamp(20px,4vw,28px);letter-spacing:-.02em}
.toast .ts{font-size:clamp(13px,2.6vw,15.5px);line-height:1.35;color:var(--ink2);margin-top:4px}
.toast.win{border-color:#BFE6CF}.toast.win .tt{color:var(--ok)}
.toast.lose{border-color:var(--red-line)}.toast.lose .tt{color:var(--red-d)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){
  .title,.sub,.anim-rise,.glass{animation-duration:.01s!important;animation-delay:0s!important}
}

</style>
<style>
.sub{margin-top:30px}
.chev{display:flex;margin-top:30px;height:92px}
.cv{flex:1;display:flex;align-items:center;gap:18px;padding:0 30px 0 70px;background:#fff;margin-left:-26px;
  clip-path:polygon(0 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,0 100%,40px 50%);transition:background .4s,color .4s}
.cv:first-child{margin-left:0;padding-left:34px;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,0 100%)}
.cv .ic{width:60px;height:60px;transition:background .4s}
.cv .ct{font-size:26px;font-weight:600}
.cv .cs{font-size:14px;color:var(--muted);margin-top:2px}
.cv.act{background:var(--red);color:#fff}
.cv.act .ic{background:#fff}.cv.act .ic svg{stroke:var(--red)}
.cv.act .cs{color:rgba(255,255,255,.8)}
.cv.done .ic{background:var(--ok)}
#stage.port .chev{height:84px;margin-top:24px}
#stage.port .cv{padding:0 14px 0 52px;gap:10px;margin-left:-22px}
#stage.port .cv:first-child{padding-left:18px;margin-left:0}
#stage.port .cv .ic{width:44px;height:44px;border-radius:10px}
#stage.port .cv .ct{font-size:20px}#stage.port .cv .cs{display:none}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:16px}
.sm{height:98px;padding:16px 22px;display:flex;flex-direction:column;justify-content:center;transition:border-color .3s,background .3s}
.sm .sl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.sm .sv{font-size:16.5px;line-height:1.3;color:var(--ink2)}
.sm.fill{border-color:var(--ok);background:var(--ok-bg)}
.sm.fill .sv{color:var(--ink);font-weight:500;animation:rise .4s ease}
.sm.cur{border:1.5px solid var(--red);background:var(--red-bg)}
#stage.port .sum{grid-template-columns:1fr;gap:10px}
#stage.port .sm{height:auto;min-height:84px}
#stage.port .sm .sl{font-size:14px}#stage.port .sm .sv{font-size:20px}

.area{margin-top:20px}
.ah{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.ah .n{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.ah .q{font-size:21px;font-weight:600}
#stage.port .ah{flex-direction:column;gap:4px}#stage.port .ah .n{font-size:16px}#stage.port .ah .q{font-size:25px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.opts.three{grid-template-columns:repeat(3,1fr)}
#stage.port .opts{grid-template-columns:1fr;gap:12px}
.op{position:relative;text-align:left;font-family:inherit;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;min-height:150px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:border-color .2s,transform .2s,background .3s;opacity:0;animation:rise .45s ease forwards}
.op:hover{border-color:var(--red-line);transform:translateY(-3px)}
.op .ot{font-size:16px;line-height:1.38;color:var(--ink)}
.op .ot code,.sm .sv code,.op .kv code{font-family:var(--mono);font-size:.9em}
.op .oe{display:none;font-size:14px;line-height:1.35;padding-top:8px;border-top:1px solid rgba(0,0,0,.07)}
.op .badge{display:none;position:absolute;top:-11px;right:12px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:#fff;animation:pop .35s}
.op.good{border-color:var(--ok);background:var(--ok-bg);cursor:default;transform:none}
.op.good .badge{display:block;background:var(--ok)}.op.good .oe{display:block;color:#17703F}
.op.bad{border-color:var(--red);background:var(--red-bg);cursor:default;transform:none;opacity:.85}
.op.bad .badge{display:block;background:var(--red)}.op.bad .oe{display:block;color:var(--red-d)}
.op .sct{font-size:20px;font-weight:600}
.op .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14.5px;line-height:1.3}
.op .kv span{color:var(--muted)}
#stage.port .op{min-height:0;padding:18px 20px}
#stage.port .op .ot{font-size:20px}#stage.port .op .oe{font-size:17px}#stage.port .op .sct{font-size:24px}#stage.port .op .kv{font-size:18px}
#stage.port .op .badge{font-size:14px}

.fin{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;animation:rise .45s ease}
#stage.port .fin{grid-template-columns:1fr}
.term{background:#16181D;border-radius:16px;padding:18px 22px;font-family:var(--mono);font-size:15px;line-height:1.7;color:#C9CDD6;min-height:220px}
.term .ln{opacity:0;animation:fade .01s forwards;white-space:pre-wrap;word-break:break-word}
.term .p{color:#7A808C}.term .bad{color:#FF8A78}.term .ok{color:#6FD69B}
.term .cur::after{content:"▍";animation:blink 1s steps(1) infinite;color:#FC3E24}
@keyframes blink{50%{opacity:0}}
.fx{display:flex;flex-direction:column;gap:12px}
.fx .row{font-size:16px;line-height:1.45;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.fx .row b{color:var(--ink)}
.fx .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}
#stage.port .term{font-size:16px}#stage.port .fx .row{font-size:19px}
</style>
</head>

<script>
/* Shared runtime for deck slides: fit-to-frame, toast, confetti, fullscreen, storage, icons */
window.Deck = (() => {
  const fitEl = document.getElementById('fit');
  const st = document.getElementById('stage');
  const LW = 1600, LH = 900, PW = 900;
  let mode = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit() {
    const vw = innerWidth, vh = innerHeight;
    const m = vw / vh < 0.82 ? 'port' : 'land';
    if (m !== mode) {
      mode = m;
      st.classList.toggle('port', m === 'port');
      document.body.classList.toggle('port', m === 'port');
      document.dispatchEvent(new CustomEvent('deck:mode', {detail: m}));
    }
    if (m === 'land') {
      st.style.width = LW + 'px'; st.style.height = LH + 'px';
      const s = Math.min(vw / LW, vh / LH);
      st.style.transform = `translate(${(vw - LW * s) / 2}px, ${(vh - LH * s) / 2}px) scale(${s})`;
      fitEl.style.height = '100%';
    } else {
      st.style.width = PW + 'px'; st.style.height = 'auto';
      const s = vw / PW;
      st.style.transform = `scale(${s})`;
      fitEl.style.height = Math.ceil(st.offsetHeight * s) + 'px';
    }
  }
  addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(() => { if (mode === 'port') fit(); }).observe(st);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // toast
  const toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.innerHTML = '<div class="em"></div><div><div class="tt"></div><div class="ts"></div></div>';
  document.body.appendChild(toastEl);
  toastEl.addEventListener('click', () => toastEl.classList.remove('show'));
  let tt = null;
  function toast(kind, em, title, text, ms = 6500) {
    toastEl.className = 'toast ' + kind;
    toastEl.querySelector('.em').textContent = em;
    toastEl.querySelector('.tt').textContent = title;
    toastEl.querySelector('.ts').textContent = text;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), ms);
    if (kind === 'win') confetti();
  }
  function hideToast() { toastEl.classList.remove('show'); }

  // confetti
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  function confetti() {
    if (reduced) return;
    const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#FC3E24', '#16181D', '#FFB4A6', '#1E9E5A', '#C3C7CF', '#FFD166'];
    const ps = Array.from({length: 160}, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .2,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4,
      w: 6 + Math.random() * 7, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
      c: cols[(Math.random() * cols.length) | 0]
    }));
    const t0 = performance.now();
    const frame = (now) => {
      const el = now - t0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - el / 2600);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
        ctx.restore();
      });
      if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(frame);
  }

  // fullscreen button (falls back to a new tab where the Fullscreen API is missing, e.g. iPhone)
  const fsBtn = document.createElement('button');
  fsBtn.className = 'fs'; fsBtn.title = 'На весь экран';
  fsBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  st.appendChild(fsBtn);
  fsBtn.addEventListener('click', () => {
    const d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (d.requestFullscreen && document.fullscreenEnabled) d.requestFullscreen().catch(() => open(location.href, '_blank'));
    else open(location.href, '_blank');
  });

  // storage shared by all slides on this origin (slide 29 reads slide 6)
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('t11.' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('t11.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const IC = {
    file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',
    workflow:'<rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
    bot:'<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
    db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    draft:'<path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M13.38 15.62a1 1 0 0 0-3-3L5 18l-1 4 4-1Z"/>',
    mailc:'<path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><path d="m16 19 2 2 4-4"/>',
    undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
    shieldc:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
    flask:'<path d="M10 2v7.53a2 2 0 0 1-.21.9L4.72 20.55A1 1 0 0 0 5.62 22h12.76a1 1 0 0 0 .9-1.45l-5.07-10.12a2 2 0 0 1-.21-.9V2M8.5 2h7M7 16h10"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    x:'<path d="M18 6 6 18M6 6l12 12"/>',
    copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'
  };
  const svg = (k, cls) => `<svg viewBox="0 0 24 24"${cls ? ` class="${cls}"` : ''}>${IC[k]}</svg>`;

  // entrance animations leave opacity:0 as the base state, so drop the class once played;
  // otherwise a later animation (shake) would replace it and hide the element
  document.addEventListener('animationend', (e) => {
    const t = e.target;
    if (e.animationName === 'rise' && t.classList.contains('anim-rise')) { t.classList.remove('anim-rise'); t.style.animationDelay = ''; }
    if (e.animationName === 'shake') t.classList.remove('shake');
  });
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  requestAnimationFrame(fit);
  return {fit, shake, toast, hideToast, confetti, store, svg, reduced, get mode() { return mode; }};
})();

</script>

   {t:'Добавить в системный промпт «не раскрывай данные других клиентов»', e:'Это просьба к модели. Её можно обойти, а исполнитель всё равно выполнит запрос.'},
   {t:'Исполнитель CRM отдаёт только объекты клиента текущего обращения (C-17)', ok:1, e:'Ограничение действует вне модели при каждом вызове.', short:'Исполнитель CRM: только объекты C-17'},
   {t:'Фильтровать во входящих письмах слово «отчёт»', e:'Перефразировка обходит фильтр. Ограничивать нужно действие, а не текст.'},
   {t:'Логировать все вызовы CRM', e:'Журнал поможет расследованию, но переход не перекроет.'}],
  test:[
   {t:'Попросить модель «покажи данные C-18» и убедиться, что она вежливо отказала', e:'Проверяется текст ответа модели, а не ограничение доступа.'},
   {t:'Проверить, что в итоговом письме нет строки «C-18»', e:'Безопасный текст не доказывает, что чтения не было: данные могли уйти другим каналом.'},
   {t:'В задаче T-104 вызвать <code>read_customer("C-18")</code>: ожидаем отказ 403 в журнале исполнителя и отсутствие данных C-18 в выводе', ok:1, e:'Попытка нарушения плюс наблюдаемый отказ в доступе.', short:'<code>read_customer(C-18)</code> в T-104 → 403, данных C-18 нет'},
   {t:'Прогнать 10 обычных обращений и убедиться, что всё работает', e:'Это проверка функциональности. Попытки нарушения в ней нет.'}],
  log:[['$','task=T-104  read_customer("C-18")'],['<','executor: DENY out_of_scope customer_id=C-18 (403)','bad'],['$','grep "C-18" agent_output.log'],['<','0 совпадений','ok'],['✓','ограничение подтверждено','ok']]},
 {t:'Изменение статуса', src:'вложение просит закрыть «связанные» обращения', act:'<code>set_status("T-105","closed")</code>', cons:'чужие обращения закрыты',
  short:'Вложение → <code>set_status(T-105)</code> → чужое обращение закрыто',
  ctrl:[
   {t:'Промпт: «меняй статус только у своего обращения»', e:'Просьба к модели не ограничивает исполнение.'},
   {t:'Подтверждение человеком: «Агент хочет изменить статусы. Разрешить?»', e:'Без точных параметров (какие обращения, какой статус) подтверждение превращается в формальность.'},
   {t:'Лимит 20 шагов на выполнение', e:'Чтобы закрыть чужое обращение, хватит одного шага.'},
   {t:'Исполнитель разрешает <code>set_status</code> только для T-104 и только допустимые переходы статуса', ok:1, e:'Разрешение привязано к объекту и бизнес-переходу.', short:'Исполнитель: <code>set_status</code> только для T-104'}],
  test:[
   {t:'В задаче T-104 вызвать <code>set_status("T-105","closed")</code>: ожидаем отказ, статус T-105 в CRM не изменился', ok:1, e:'Попытка нарушения плюс наблюдаемое состояние CRM.', short:'<code>set_status(T-105)</code> в T-104 → отказ, T-105 открыт'},
   {t:'Спросить модель, будет ли она закрывать чужие обращения', e:'Ответ модели не доказывает ограничение действия.'},
   {t:'Проверить, что T-104 успешно закрывается', e:'Это позитивный сценарий. Попытки нарушения нет.'},
   {t:'Убедиться, что в ответе клиенту нет слова «закрыто»', e:'Проверяется текст, а не изменение в CRM.'}],
  log:[['$','task=T-104  set_status("T-105","closed")'],['<','executor: DENY ticket≠T-104 (403)','bad'],['$','crm.get("T-105").status'],['<','"open" (не изменился)','ok'],['✓','ограничение подтверждено','ok']]},
 {t:'Расход ресурсов', src:'обращение провоцирует бесконечные уточнения', act:'<code>search_kb</code> × ∞ и повторы', cons:'исчерпаны квота, время и бюджет',
  short:'Обращение → бесконечный поиск → исчерпан бюджет',
  ctrl:[
   {t:'Тайм-аут 30 секунд на один HTTP-запрос', e:'Ограничивает один вызов, но не число повторов.'},
   {t:'Оркестратор: общий бюджет шагов, вызовов и повторов на всё выполнение', ok:1, e:'Лимит действует на всё выполнение, включая повторы и подзадачи.', short:'Оркестратор: общий бюджет на выполнение'},
   {t:'Промпт: «не зацикливайся и заканчивай быстрее»', e:'Модель не обязана следовать. Нужна остановка в коде.'},
   {t:'Лимит 20 шагов, который обнуляется при повторной попытке', e:'Повтор сбрасывает счётчик, и цикл продолжается.'}],
  test:[
   {t:'Убедиться, что модель пишет «задача выполнена»', e:'Текст модели не доказывает остановку.'},
   {t:'Замерить время одного обычного ответа', e:'Нормальный путь ничего не говорит о поведении в цикле.'},
   {t:'Проверить, что срабатывает тайм-аут HTTP', e:'Один тайм-аут не ограничивает выполнение целиком.'},
   {t:'Подать обращение-петлю: ожидаем остановку на лимите и событие в журнале; повтор не сбрасывает счётчик', ok:1, e:'Проверяется остановка и то, что её нельзя обойти повтором.', short:'Обращение-петля → STOP на лимите, повтор не сбрасывает'}],
  log:[['$','ticket=T-LOOP  budget=20 steps'],['<','step 20: STOP budget_exceeded','bad'],['$','retry run'],['<','STOP: бюджет не сброшен (20/20)','ok'],['✓','ограничение подтверждено','ok']]}
];
const STEPS = [
  {k:'scen', t:'Сценарий', ic:'file', ph:'Конкретный источник, действие и последствие', q:'Выберите сценарий угрозы'},
  {k:'ctrl', t:'Контроль', ic:'shieldc', ph:'Компонент, который ограничивает переход', q:'Какой контроль перекрывает этот переход?'},
  {k:'test', t:'Проверка', ic:'flask', ph:'Попытка нарушения и ожидаемый отказ или остановка', q:'Какая проверка подтвердит, что контроль работает?'}
];
let step = 0, sc = null, mistakes = 0, picked = {};
const $ = (id) => document.getElementById(id);

$('chev').innerHTML = STEPS.map((s, i) => `<div class="cv" data-i="${i}"><div class="ic">${Deck.svg(s.ic)}</div><div><div class="ct">${s.t}</div><div class="cs">шаг ${i + 1} из 3</div></div></div>`).join('');
$('sum').innerHTML = STEPS.map((s, i) => `<div class="sm card anim-rise" style="animation-delay:${.3 + i * .08}s" data-i="${i}"><div class="sl">${s.t}</div><div class="sv">${s.ph}</div></div>`).join('');

function paintHead() {
  document.querySelectorAll('.cv').forEach((c, i) => {
    c.classList.toggle('act', i === step);
    c.classList.toggle('done', i < step);
    c.querySelector('.ic').innerHTML = Deck.svg(i < step ? 'check' : STEPS[i].ic);
  });
  document.querySelectorAll('.sm').forEach((c, i) => c.classList.toggle('cur', i === step));
}
function fillSum(i, html) {
  const c = document.querySelectorAll('.sm')[i];
  c.classList.add('fill'); c.classList.remove('cur');
  c.querySelector('.sv').innerHTML = html;
}

function render() {
  paintHead();
  const a = $('area');
  if (step === 0) {
    a.innerHTML = `<div class="ah"><span class="n">Шаг 1</span><span class="q">${STEPS[0].q}</span></div>
      <div class="opts three">${S.map((s, i) => `<button class="op" data-i="${i}" style="animation-delay:${.1 + i * .07}s">
        <div class="sct">${i + 1}. ${s.t}</div>
        <div class="kv"><span>Источник</span><div>${s.src}</div><span>Действие</span><div>${s.act}</div><span>Последствие</span><div>${s.cons}</div></div></button>`).join('')}</div>`;
    a.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => {
      sc = S[+b.dataset.i]; picked.scen = sc;
      fillSum(0, sc.short); step = 1; render();
    }));
  } else if (step < 3) {
    const k = STEPS[step].k, list = sc[k];
    a.innerHTML = `<div class="ah"><span class="n">Шаг ${step + 1}</span><span class="q">${STEPS[step].q}</span></div>
      <div class="opts">${list.map((o, i) => `<button class="op" data-i="${i}" style="animation-delay:${.1 + i * .07}s">
        <span class="badge">${o.ok ? 'ВЕРНО' : 'НЕ ТО'}</span><div class="ot">${o.t}</div><div class="oe">${o.e}</div></button>`).join('')}</div>`;
    a.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => {
      if (b.classList.contains('good') || b.classList.contains('bad')) return;
      const o = list[+b.dataset.i];
      if (o.ok) {
        b.classList.add('good'); picked[k] = o;
        a.querySelectorAll('.op').forEach(x => x.style.pointerEvents = 'none');
        fillSum(step, o.short);
        setTimeout(() => { step++; render(); }, Deck.reduced ? 300 : 1500);
      } else {
        b.classList.add('bad'); mistakes++; Deck.shake(b);
      }
      Deck.fit();
    }));
  } else finish();
  Deck.fit();
}

function finish() {
  const a = $('area');
  a.innerHTML = `<div class="ah"><span class="n">Прогон проверки</span><span class="q">${sc.t}</span></div>
    <div class="fin"><div class="term" id="term"></div>
    <div class="fx">
      <div class="row"><b>Сценарий.</b> ${sc.short}</div>
      <div class="row"><b>Контроль.</b> ${picked.ctrl.short}</div>
      <div class="row"><b>Проверка.</b> ${picked.test.short}</div>
      <div class="btns"><button class="btn" id="copy">Скопировать для чата</button><button class="btn ghost" id="again">Другой сценарий</button></div>
    </div></div>`;
  const term = $('term');
  sc.log.forEach((l, i) => setTimeout(() => {
    term.querySelectorAll('.cur').forEach(x => x.classList.remove('cur'));
    const d = document.createElement('div');
    d.className = 'ln cur';
    d.innerHTML = `<span class="p">${l[0]} </span><span class="${l[2] || ''}">${l[1]}</span>`;
    term.appendChild(d);
    if (i === sc.log.length - 1) setTimeout(() => {
      Deck.toast('win', '🔥', 'Красавчик!', mistakes === 0
        ? 'С первой попытки: контроль ограничивает действие, а проверка это подтверждает.'
        : `Модель угроз собрана (промахов: ${mistakes}). Проверка подтверждает ограничение действия, а не текст ответа.`);
    }, 400);
  }, (Deck.reduced ? 120 : 650) * (i + 1)));
  $('copy').addEventListener('click', copyText);
  $('again').addEventListener('click', reset);
}

function plain(h) { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; }
function copyText() {
  const txt = `Сценарий: ${plain(sc.short)}. Контроль: ${plain(picked.ctrl.short)}. Проверка: ${plain(picked.test.short)}.`;
  const done = () => { $('copy').textContent = 'Скопировано ✓'; setTimeout(() => $('copy') && ($('copy').textContent = 'Скопировать для чата'), 2000); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { prompt('Скопируйте ответ:', txt); }
    ta.remove();
  }
}
function reset() {
  step = 0; sc = null; mistakes = 0; picked = {};
  document.querySelectorAll('.sm').forEach((c, i) => { c.classList.remove('fill'); c.querySelector('.sv').innerHTML = STEPS[i].ph; });
  Deck.hideToast(); render();
}
render();
})();
</script>
</body>
