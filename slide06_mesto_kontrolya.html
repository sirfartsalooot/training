<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Место контроля</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#FC3E24; --red-d:#E0321B; --red-bg:#FFF1EE;
  --ink:#16181D; --ink2:#4A4F5B; --muted:#8A909C;
  --line:#E2E5EB; --edge:#B9BEC8; --radio:#C3C7CF;
  --ok:#1E9E5A; --ok-bg:#E8F6EE; --warn:#E39A1B; --warn-bg:#FDF4E3; --bad:#9AA0AA; --bad-bg:#F1F2F4;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,#E9ECF0 0%,#F6F6F8 35%,#FFFFFF 100%);
  font-family:'Golos Text','TT Positive','Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
.title{position:absolute;margin:0;font-weight:700;line-height:1;letter-spacing:-.03em;color:#000;white-space:nowrap}
.logo{position:absolute;border-radius:6px}
.num{position:absolute;font-size:15px;color:var(--muted)}

/* ---------- edges ---------- */
#edges{position:absolute;left:0;top:0;overflow:visible}
#edges path{fill:none;stroke:var(--edge);stroke-width:1.6;transition:stroke .35s,stroke-width .35s}
#edges path.dash{stroke-dasharray:6 6}
#edges path.hit{stroke:var(--red);stroke-width:2.6}
#edges path.draw{transition:stroke-dashoffset .9s ease}

/* ---------- nodes ---------- */
.node{position:absolute;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 18px rgba(27,32,51,.07);display:flex;align-items:center;gap:var(--gap,14px);
  padding:0 16px;cursor:pointer;outline:none;
  transition:transform .25s,box-shadow .25s,border-color .25s,background .35s;
  opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.node .ic{flex:none;width:var(--ic,52px);height:var(--ic,52px);border-radius:12px;background:var(--red);display:grid;place-items:center}
.node .ic svg{width:56%;height:56%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node .t{font-weight:600;font-size:var(--fs-t,20px);line-height:1.12;color:var(--ink)}
.node .s{font-size:var(--fs-s,14.5px);line-height:1.25;color:var(--ink2);margin-top:4px}
.node .s code{font-family:var(--mono);font-size:.9em}
.node:hover,.node:focus-visible,.node.focus{transform:translateY(-3px);box-shadow:0 14px 30px rgba(27,32,51,.13);border-color:#F6B2A6}
.node.attacker{border:1.5px solid var(--red);background:var(--red-bg)}
.node.attacker .t{color:var(--red-d)}
.node .tag{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:99px;background:var(--red);color:#fff;font-size:var(--fs-tag,11.5px);font-weight:600;letter-spacing:.02em}
.node.ext{border:1.5px dashed var(--red);background:rgba(255,255,255,.6);box-shadow:none}
.node.ext .ic{background:#fff;border:1.5px solid var(--red)}
.node.ext .ic svg{stroke:var(--red)}
.node.hot{border-color:var(--red);box-shadow:0 0 0 4px rgba(252,62,36,.15),0 14px 30px rgba(252,62,36,.18)}
.node.leak{background:var(--red);border-style:solid;animation:shake .5s}
#stage.ready .node{opacity:1;animation:none}
#stage.ready .slot{transform:scale(1);animation:none}
#stage.ready .slot:hover,#stage.ready .slot:focus-visible{transform:scale(1.12)}
#stage.ready .node.leak{animation:shake .5s}
#stage.ready .slot.deny{animation:shake .4s}
.node.leak .t,.node.leak .s{color:#fff}
.node.leak .ic{background:#fff}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- control slots ---------- */
.slot{position:absolute;width:var(--slot,44px);height:var(--slot,44px);margin:calc(var(--slot,44px)/-2) 0 0 calc(var(--slot,44px)/-2);
  border-radius:50%;background:#fff;border:2px dashed var(--radio);display:grid;place-items:center;
  font-weight:700;font-size:var(--fs-slot,17px);line-height:1;font-family:inherit;color:var(--muted);cursor:pointer;z-index:5;padding:0;
  transition:background .25s,border-color .25s,color .25s,transform .2s,box-shadow .25s;
  transform:scale(0);animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards}
.slot:hover,.slot:focus-visible{border-color:var(--red);color:var(--red);outline:none;transform:scale(1.12)}
.slot::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--red);opacity:0;animation:ring 2.4s ease-out infinite;animation-delay:inherit;pointer-events:none}
.slot .sh{display:none;width:52%;height:52%;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.slot .lt{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:none;place-items:center}
.slot.on{background:var(--red);border:2px solid var(--red);color:#fff;box-shadow:0 6px 16px rgba(252,62,36,.35)}
.slot.on::before,.slot.v-ok::before,.slot.v-warn::before,.slot.v-bad::before,.slot.v-off::before,.locked .slot::before{display:none}
.slot.on .sh,.slot.v-ok .sh,.slot.v-warn .sh,.slot.v-bad .sh{display:block}
.slot.on .l0,.slot.v-ok .l0,.slot.v-warn .l0,.slot.v-bad .l0{display:none}
.slot.on .lt,.slot.v-ok .lt,.slot.v-warn .lt,.slot.v-bad .lt{display:grid}
.slot.v-ok{background:var(--ok);border:2px solid var(--ok);box-shadow:0 0 0 7px rgba(30,158,90,.18)}
.slot.v-warn{background:var(--warn);border:2px solid var(--warn);box-shadow:0 0 0 7px rgba(227,154,27,.18)}
.slot.v-bad{background:var(--bad);border:2px solid var(--bad)}
.slot.v-off{background:#fff;border:2px solid var(--bad);color:var(--bad)}
.slot.ghost{opacity:.55}
.slot.deny{animation:shake .4s}
.locked .slot{cursor:default}
.chip{position:absolute;transform:translate(-50%,0);padding:3px 9px;border-radius:99px;font-size:var(--fs-chip,12px);font-weight:700;letter-spacing:.03em;
  white-space:nowrap;z-index:6;pointer-events:none;animation:chipIn .35s ease-out}
.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.bad{background:var(--bad);color:#fff}.chip.off{background:#fff;color:var(--ink2);border:1px solid var(--line)}
@keyframes pop{to{transform:scale(1)}}
@keyframes ring{0%{opacity:.55;transform:scale(.85)}70%,100%{opacity:0;transform:scale(1.35)}}
@keyframes chipIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- packet ---------- */
#packet{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--red);z-index:7;display:none;
  box-shadow:0 0 0 6px rgba(252,62,36,.2),0 0 22px rgba(252,62,36,.7)}
#packet::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(252,62,36,.5);animation:ring 1s ease-out infinite}
#packet.burst{animation:burst .55s ease-out forwards}
@keyframes burst{to{transform:scale(3);opacity:0}}

/* ---------- caption / hint area ---------- */
#caption{position:absolute;display:flex;align-items:center;gap:18px;padding:16px 22px;border-radius:16px;background:rgba(243,244,246,.85);
  opacity:0;animation:rise .6s ease forwards;animation-delay:1.1s}
#caption .cap-ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
#caption .cap-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#caption .cap-t{font-weight:600;font-size:var(--fs-capt,19px);line-height:1.2}
#caption .cap-s{font-size:var(--fs-caps,15.5px);line-height:1.35;color:var(--ink2);margin-top:4px}
#caption .cap-s code,.log code,.quote{font-family:var(--mono)}
#caption.attack{background:var(--red-bg)}
#caption.attack .cap-t{color:var(--red-d)}
#caption .verdict{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.8em;font-weight:700;color:#fff;margin-left:8px;vertical-align:2px}

/* ---------- panel ---------- */
.panel{position:absolute;display:flex;flex-direction:column;gap:14px;opacity:0;animation:rise .6s ease forwards;animation-delay:.5s}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(27,32,51,.07);padding:20px 22px}
.eyebrow{font-size:var(--fs-eye,12.5px);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.task p{margin:0 0 10px;font-size:var(--fs-p,15.5px);line-height:1.4;color:var(--ink2)}
.quote{display:block;margin:0 0 12px;padding:10px 12px;border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 8px 8px 0;
  font-size:var(--fs-q,13px);line-height:1.45;color:var(--red-d)}
.task.compact p,.task.compact .quote{display:none}
.shields{display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:var(--fs-p,15px);color:var(--ink2)}
.shields svg{width:24px;height:24px;stroke:var(--radio);fill:none;stroke-width:2;transition:all .25s}
.shields svg.used{stroke:var(--red);fill:var(--red-bg)}
.shields.deny{animation:shake .4s}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:var(--btn-pad,13px 16px);background:var(--red);color:#fff;font-weight:600;font-size:var(--fs-btn,16px);line-height:1.1;font-family:inherit;cursor:pointer;
  transition:transform .15s,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(252,62,36,.3)}
.btn:hover{background:var(--red-d);transform:translateY(-1px)}
.btn:disabled{background:#F0B3A9;box-shadow:none;cursor:default;transform:none}
.btn.ghost{flex:none;background:#F1F2F4;color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:#E6E8EC}
.log{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.log h4{margin:0 0 10px;font-size:var(--fs-h4,17px);line-height:1.25}
.log ol{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;padding:7px 0;border-top:1px solid #F0F1F4;font-size:var(--fs-li,13.5px);line-height:1.3;color:var(--muted);transition:color .3s}
.log li:first-child{border-top:0}
.log li b{color:var(--radio);font-size:1.05em}
.log li code{font-size:.92em;color:inherit;word-break:break-word}
.log li span{grid-column:2;font-size:.95em}
.log li.now{color:var(--ink)}.log li.now b{color:var(--red)}
.log li.done{color:var(--ink2)}.log li.done b{color:var(--red)}
.log li.stop{color:var(--ok)}.log li.stop b{color:var(--ok)}
.log li.skip{opacity:.35}
.res{display:grid;grid-template-columns:30px 1fr;gap:8px 10px;margin:0 0 12px}
.res .b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.res .b.ok{background:var(--ok)}.res .b.warn{background:var(--warn)}.res .b.bad{background:var(--bad)}.res .b.off{background:#fff;color:var(--bad);border:2px solid var(--bad)}.res .b.res{background:#fff;color:var(--ok);border:2px solid var(--ok)}
.res .x{font-size:var(--fs-li,13.5px);line-height:1.38;color:var(--ink2)}
.res .x strong{color:var(--ink);font-weight:600}
.note{font-size:var(--fs-li,13.5px);line-height:1.4;color:var(--ink2);background:#F5F6F8;border-radius:10px;padding:10px 12px;margin-bottom:12px}

/* ---------- toast ---------- */
#toast{position:absolute;z-index:20;display:flex;gap:16px;align-items:center;padding:20px 26px;border-radius:20px;background:#fff;
  box-shadow:0 24px 60px rgba(27,32,51,.22);border:1px solid var(--line);opacity:0;pointer-events:none;transform:translateY(-20px) scale(.96);
  transition:opacity .35s,transform .45s cubic-bezier(.3,1.5,.5,1)}
#toast.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
#toast .em{font-size:var(--fs-em,46px);line-height:1}
#toast .tt{font-weight:700;font-size:var(--fs-tt,30px);letter-spacing:-.02em}
#toast .ts{font-size:var(--fs-ts,15.5px);line-height:1.35;color:var(--ink2);margin-top:4px}
#toast.win{border-color:#BFE6CF}#toast.win .tt{color:var(--ok)}
#toast.lose{border-color:#F6B2A6}#toast.lose .tt{color:var(--red-d)}

#fs{position:absolute;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;z-index:8;padding:0}
#fs svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ---------- portrait sizes ---------- */
#stage.port{--fs-t:22px;--fs-s:16px;--ic:54px;--gap:12px;--slot:52px;--fs-slot:20px;--fs-chip:15px;--fs-tag:13px;
  --fs-capt:24px;--fs-caps:20px;--fs-p:21px;--fs-q:18px;--fs-eye:16px;--fs-btn:22px;--btn-pad:18px 18px;--fs-h4:23px;--fs-li:19px;
  --fs-em:60px;--fs-tt:40px;--fs-ts:21px}
#stage.port .shields svg{width:32px;height:32px}
#stage.port .log li{grid-template-columns:34px 1fr}
#stage.port .res{grid-template-columns:38px 1fr}
#stage.port .res .b{width:38px;height:38px;font-size:18px}

@media (prefers-reduced-motion:reduce){
  .node,.panel,#caption{animation-duration:.01s!important;animation-delay:0s!important}
  .slot{animation-duration:.01s!important}
  .slot::before,#packet::after{animation:none}
}
</style>
</head>

    }
    for (const k in L.slots) {

      else { const r = R[s.n]; x = s.c === 'tl' ? r.l : r.r; y = r.t; }
      slotEls[k].style.left = x + 'px'; slotEls[k].style.top = y + 'px';
      slotEls[k].dataset.x = x; slotEls[k].dataset.y = y;

/* ================= run ================= */
const sleep = (ms) => new Promise(r => setTimeout(r, ms * SPEED));
const SPEED = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.25 : 1;
const PX_PER_MS = 0.7;

function travel(edge, f0, f1) {
  return new Promise(res => {
    const p = edgeEls[edge];
    p.classList.add('hit'); setMarkers(edge);
    const len = p.getTotalLength();
    const dur = Math.max(160, Math.abs(f1 - f0) * len / PX_PER_MS) * SPEED;
    const t0 = performance.now();
    let done = false;
    packet.style.display = 'block';
    // rAF stalls in hidden tabs/iframes: a timer guarantees the run always completes
    const finish = () => { if (done) return; done = true;
      const pt = edgeEls[edge].getPointAtLength(f1 * edgeEls[edge].getTotalLength());
      packet.style.left = pt.x + 'px'; packet.style.top = pt.y + 'px'; res(); };
    setTimeout(finish, dur + 80);
    const tick = (now) => {
      if (done) return;
      const k = Math.min(1, (now - t0) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const len2 = edgeEls[edge].getTotalLength();
      const pt = edgeEls[edge].getPointAtLength((f0 + (f1 - f0) * e) * len2);
      packet.style.left = pt.x + 'px'; packet.style.top = pt.y + 'px';
      if (k < 1) requestAnimationFrame(tick); else finish();
    };
    requestAnimationFrame(tick);
  });
}
function chip(k, cls, text) {
  const c = document.createElement('div');
  c.className = 'chip ' + cls; c.textContent = text; c.dataset.k = k;
  stage.appendChild(c); positionChip(c);
}
function positionChip(c) {

  const above = !!L.slots[k].n;
  c.style.left = s.dataset.x + 'px';
  c.style.top = (+s.dataset.y + (above ? -off - (LN === 'port' ? 26 : 22) : off)) + 'px';
}
function setVerdict(k, cls) {
  const s = slotEls[k];
  s.classList.remove('on', 'v-ok', 'v-warn', 'v-bad', 'v-off', 'ghost');
  if (cls) s.classList.add(cls);
}
const NODE_AT = {tk_ctx:['tk','ctx'], orch_ctx:['orch','ctx'], orch_llm:['orch','llm'], orch_exec:['orch','exec'], exec_crm:['exec','crm'], exec_mail:['exec','mail'], mail_ext:['mail','ext']};
function hot(id) { Object.values(nodeEls).forEach(e => e.classList.remove('hot')); if (id) nodeEls[id].classList.add('hot'); }

async function check(k) {
  if (!placed.has(k)) return 'pass';
  const v = SLOTS[k].v;
  if (v === 'ok') { setVerdict(k, 'v-ok'); chip(k, 'ok', 'СТОП'); return 'stop'; }
  if (v === 'warn') {
    setVerdict(k, 'v-warn'); chip(k, 'warn', 'ослабил');
    setCaption({ic: k, t: `${SLOTS[k].n}: ослабил, но не остановил`, s: SLOTS[k].r}, 'attack');
    await sleep(1500); return 'pass';
  }
  setVerdict(k, 'v-bad'); chip(k, 'bad', 'не сработало');
  setCaption({ic: k, t: `${SLOTS[k].n}: не сработало`, s: SLOTS[k].r}, 'attack');
  await sleep(1400); return 'pass';
}

async function run() {
  if (state === 'running') return;
  if (state === 'done') softReset();
  state = 'running'; stage.classList.add('locked');
  $('run').disabled = true; $('reset').disabled = true;
  $('task').classList.add('compact');
  renderLogIdle();
  hideToast();
  let stopped = null;
  outer:
  for (let i = 0; i < STEPS.length; i++) {
    const st = STEPS[i];
    logStep(i, 'now');
    setCaption({ic: String(i + 1), t: `Шаг ${i + 1} из ${STEPS.length}: <code>${st.c}</code>`, s: st.s}, 'attack');
    for (const it of st.it) {
      if (it.length === 1) {
        const r = await check(it[0]);
        if (r === 'stop') { stopped = {k: it[0], step: i}; break outer; }
        setCaption({ic: String(i + 1), t: `Шаг ${i + 1} из ${STEPS.length}: <code>${st.c}</code>`, s: st.s}, 'attack');
      } else {
        const [e, a, b] = it;
        const fa = typeof a === 'string' ? slotFrac(e, a) : a, fb = typeof b === 'string' ? slotFrac(e, b) : b;
        const ends = NODE_AT[e];
        if (ends) hot(fa < fb ? ends[0] : ends[1]);
        await travel(e, fa, fb);
        if (ends && (fb === 1 || fb === 0)) hot(fb === 1 ? ends[1] : ends[0]);
      }
    }
    logStep(i, 'done');
    await sleep(450);
  }
  hot(null);
  if (stopped) {
    packet.classList.add('burst');
    logStep(stopped.step, 'stop');
    for (let j = stopped.step + 1; j < STEPS.length; j++) $('st' + j).classList.add('skip');
    setCaption({ic: svg('shieldc'), t: `Атака остановлена: ${SLOTS[stopped.k].n}`, s: SLOTS[stopped.k].r});
  } else {
    nodeEls.ext.classList.add('leak');
    packet.style.display = 'none';
    setCaption({ic: svg('bolt'), t: 'Утечка: отчёт CRM у внешнего адресата', s: 'Ни один щит не перекрыл переход. Ищите места, где проверку делает инфраструктура, а не модель.'}, 'attack');
  }
  await sleep(600);
  packet.style.display = 'none'; packet.classList.remove('burst');
  // verdicts for placed slots that the packet never reached
  for (const k of placed) {
    if (slotEls[k].classList.contains('v-ok') || slotEls[k].classList.contains('v-warn') || slotEls[k].classList.contains('v-bad')) continue;
    if (SLOTS[k].v === 'off') { setVerdict(k, 'v-off'); chip(k, 'off', 'не на пути'); }
    else if (SLOTS[k].v === 'ok') { setVerdict(k, 'v-ok'); slotEls[k].classList.add('ghost'); chip(k, 'off', 'резерв'); }
    else { setVerdict(k, 'v-' + SLOTS[k].v); slotEls[k].classList.add('ghost'); }
  }
  lastResult = stopped;
  // slide 29 reads this back (same origin) to compare the first answer with the later one
  try { localStorage.setItem('t11.s06', JSON.stringify({placed: SLOT_ORDER.filter(k => placed.has(k)), stoppedAt: stopped ? stopped.k : null, ts: Date.now()})); } catch (e) {}
  state = 'done'; stage.classList.remove('locked');
  $('run').disabled = false; $('reset').disabled = false;
  $('run').textContent = 'Ещё раз ▶';
  renderResult(stopped);
  showToast(stopped);
}

function renderResult(stopped) {
  const ks = SLOT_ORDER.filter(k => placed.has(k));
  const badge = (k) => {
    const s = slotEls[k];
    const cls = s.classList.contains('ghost') && SLOTS[k].v === 'ok' ? 'res' : SLOTS[k].v;
    return `<div class="b ${cls}">${k}</div>`;
  };
  const rows = ks.map(k => {
    const ghost = slotEls[k].classList.contains('ghost') && SLOTS[k].v === 'ok';
    const txt = ghost ? 'Не понадобился в этом запуске, но страхует, если предыдущий слой откажет.' : SLOTS[k].r;
    return `${badge(k)}<div class="x"><strong>${SLOTS[k].n}.</strong> ${txt}</div>`;
  }).join('');
  const head = stopped
    ? `Атака остановлена на шаге ${stopped.step + 1}`
    : 'Атака дошла до внешнего адресата';
  const hasB = placed.has('B'), late = stopped && stopped.k !== 'B';
  let note = '';
  if (stopped && hasB && (placed.has('C') || placed.has('D'))) note = 'Эшелонированная защита: два независимых слоя. Если один откажет, второй удержит.';
  else if (late) note = 'Остановили на отправке, но отчёт CRM уже прочитан и лежит в черновике. Где можно остановить раньше?';
  else if (stopped) note = 'Один слой сработал. Что будет, если он откажет? Добавьте второй на канале отправки.';
  else note = 'Подсказка: модель можно уговорить. Ищите места, где инфраструктура проверяет конкретный вызов.';
  $('log').innerHTML = `<div class="eyebrow">Результат</div><h4>${head}</h4>
    ${ks.length ? `<div class="res">${rows}</div>` : '<div class="note">Вы не поставили ни одного щита.</div>'}
    <div class="note">${note}</div>
    <div class="btns"><button class="btn ghost" id="rev" style="flex:1">${revealed ? 'Скрыть разбор' : 'Разбор всех точек'}</button></div>`;
  $('rev').onclick = toggleReveal;
}

function toggleReveal() {
  revealed = !revealed;
  SLOT_ORDER.forEach(k => {
    if (placed.has(k)) return;
    if (revealed) { setVerdict(k, 'v-' + SLOTS[k].v); slotEls[k].classList.add('ghost'); }
    else setVerdict(k, null);
  });
  if (revealed) setCaption({ic: svg('info'), t: 'Разбор: правильных ответов несколько', s: 'B, C и D останавливают атаку на разных шагах: чем раньше, тем меньше ущерб. A помогает, но не гарантирует. E, F и G против этой атаки не работают. Наведите на кружок, чтобы увидеть объяснение.'});
  if ($('rev')) $('rev').textContent = revealed ? 'Скрыть разбор' : 'Разбор всех точек';
}

function softReset() {
  document.querySelectorAll('.chip').forEach(c => c.remove());
  Object.values(edgeEls).forEach(p => p.classList.remove('hit'));
  Object.keys(edgeEls).forEach(setMarkers);
  nodeEls.ext.classList.remove('leak');
  hot(null);
  revealed = false;
  SLOT_ORDER.forEach(k => { setVerdict(k, placed.has(k) ? 'on' : null); });
  $('task').classList.remove('compact');
  $('run').textContent = 'Запустить атаку ▶';
  renderLogIdle();
  hideToast();
  state = 'idle';
  setCaption(DEFAULT_CAP());
}
function fullReset() {
  placed.clear();
  softReset();
  renderShields();
}

/* ================= toast + confetti ================= */
let toastTimer = null;
function showToast(stopped) {
  const t = $('toast');
  if (stopped) {
    t.className = 'win';
    $('tEm').textContent = '🔥';
    $('tT').textContent = 'Красавчик!';
    $('tS').textContent = stopped.k === 'B'
      ? (placed.has('C') || placed.has('D') ? 'Атака остановлена ещё до чтения чужих данных, и есть второй слой. Это эшелонированная защита.' : 'Атака остановлена ещё до чтения чужих данных.')
      : 'Атака остановлена на отправке. А можно ли ещё раньше?';
    confetti();
  } else {
    t.className = 'lose';
    $('tEm').textContent = '😬';
    $('tT').textContent = 'Утечка!';
    $('tS').textContent = 'Отчёт CRM ушёл на report@partner-mail.io. Переставьте щиты и попробуйте ещё раз.';
  }
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6500);
}
function hideToast() { $('toast').classList.remove('show'); }
$('toast').addEventListener('click', hideToast);

function confetti() {
  if (SPEED < 1) return;
  const cv = $('confetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#FC3E24', '#16181D', '#FFB4A6', '#1E9E5A', '#C3C7CF', '#FFD166'];
  const ps = Array.from({length: 160}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .25,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4,
    w: 6 + Math.random() * 7, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  const frame = (now) => {
    const el = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / 2600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
      ctx.restore();
    });
    if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(frame);
}

/* ================= fullscreen ================= */
$('fs').addEventListener('click', () => {
  const d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (d.requestFullscreen && document.fullscreenEnabled) d.requestFullscreen().catch(() => window.open(location.href, '_blank'));
  else window.open(location.href, '_blank');
});

/* ================= init ================= */
$('run').addEventListener('click', run);
$('reset').addEventListener('click', fullReset);
renderShields(); renderLogIdle(); setCaption(DEFAULT_CAP());
applyLayout(true);
// draw-in edges
Object.values(edgeEls).forEach((p, i) => {
  const len = p.getTotalLength();
  if (!p.classList.contains('dash')) {
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    setTimeout(() => { p.classList.add('draw'); p.style.strokeDashoffset = 0; }, 650 + i * 70);
    setTimeout(() => { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; p.classList.remove('draw'); }, 1800 + i * 70);
  }
});
setTimeout(() => stage.classList.add('ready'), 2200);
window.addEventListener('resize', () => applyLayout(false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => applyLayout(false));
})();
</script>
