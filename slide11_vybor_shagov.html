<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Выбор шагов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Shared look of the "Тема 1.1" deck: tokens, stage, cards, buttons, toast */
:root{
  --red:#FC3E24; --red-d:#E0321B; --red-bg:#FFF1EE; --red-line:#F6B2A6;
  --ink:#16181D; --ink2:#4A4F5B; --muted:#7A808C;
  --line:#E2E5EB; --soft:#F3F4F6; --radio:#C3C7CF;
  --ok:#1E9E5A; --ok-bg:#E8F6EE; --warn:#E39A1B; --bad:#9AA0AA;
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,monospace;
  --shadow:0 6px 18px rgba(27,32,51,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  overflow:hidden;
  background:linear-gradient(180deg,#E9ECF0 0%,#F6F6F8 35%,#FFFFFF 100%);
  font-family:'Golos Text','TT Positive','Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);-webkit-tap-highlight-color:transparent;
}
body.port{overflow-x:hidden;overflow-y:auto}
#fit{position:relative;width:100%;height:100%}
body.port{background:#fff linear-gradient(180deg,#E9ECF0 0,#FFFFFF 700px) no-repeat}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:58px 80px 0}
#stage.port{padding:62px 30px 40px}
.glass{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none;z-index:0;
  opacity:0;animation:fade 1.2s ease .1s forwards}
#stage.port .glass{width:900px;height:506px;opacity:.7}
#stage > *:not(.glass){position:relative;z-index:1}
.logo{position:absolute!important;right:77px;top:72px;width:68px;height:68px;border-radius:6px}
#stage.port .logo{right:30px;top:60px;width:62px;height:62px}
.title{margin:0;font-weight:700;font-size:74px;line-height:1;letter-spacing:-.03em;color:#000;white-space:nowrap;
  opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
#stage.port .title{font-size:52px;white-space:normal;max-width:740px}
.sub{margin:44px 0 0;font-size:24px;line-height:1.35;color:var(--muted);opacity:0;animation:rise .6s ease .12s forwards}
#stage.port .sub{margin-top:26px;font-size:24px}
.num{position:absolute!important;right:77px;bottom:30px;font-size:15px;color:var(--muted)}
#stage.port .num{bottom:14px;right:30px}
.fs{position:absolute!important;right:118px;bottom:24px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;cursor:pointer;padding:0}
#stage.port .fs{right:auto;left:30px;bottom:8px}
.fs svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.ic{flex:none;display:grid;place-items:center;border-radius:14px;background:var(--red)}
.ic svg{width:56%;height:56%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
#stage.port .eyebrow{font-size:16px}

.btn{border:0;border-radius:12px;padding:14px 26px;background:var(--red);color:#fff;font-family:inherit;font-weight:600;font-size:17px;line-height:1.1;
  cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(252,62,36,.3)}
.btn:hover{background:var(--red-d);transform:translateY(-1px)}
.btn:disabled{background:#F0B3A9;box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
#stage.port .btn{font-size:22px;padding:18px 26px}

.anim-rise{opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .45s}

/* toast lives outside the stage, in real pixels */
.toast{position:fixed;left:50%;top:18px;z-index:40;display:flex;gap:16px;align-items:center;width:min(92vw,640px);
  padding:18px 24px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(27,32,51,.22);
  opacity:0;pointer-events:none;transform:translate(-50%,-20px) scale(.96);transition:opacity .35s,transform .45s cubic-bezier(.3,1.5,.5,1);
  font-family:'Golos Text','Segoe UI',Roboto,Arial,sans-serif}
.toast.show{opacity:1;pointer-events:auto;cursor:pointer;transform:translate(-50%,0)}
.toast .em{font-size:clamp(30px,6vw,44px);line-height:1}
.toast .tt{font-weight:700;font-size:clamp(20px,4vw,28px);letter-spacing:-.02em}
.toast .ts{font-size:clamp(13px,2.6vw,15.5px);line-height:1.35;color:var(--ink2);margin-top:4px}
.toast.win{border-color:#BFE6CF}.toast.win .tt{color:var(--ok)}
.toast.lose{border-color:var(--red-line)}.toast.lose .tt{color:var(--red-d)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){
  .title,.sub,.anim-rise,.glass{animation-duration:.01s!important;animation-delay:0s!important}
}

</style>
<style>
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:42px;margin-top:40px}
#stage.port .grid{grid-template-columns:1fr;gap:26px;margin-top:30px}
.v{height:540px}
#stage.port .v{height:auto}
.flip{position:relative;width:100%;height:100%;transition:transform .32s ease-in}
.v.turning .flip{transform:scaleX(0)}
.face{position:absolute;inset:0;padding:28px 30px 24px;display:flex;flex-direction:column}
.back{display:none}
.v.flipped .back{display:flex}
.v.flipped .front{visibility:hidden}
#stage.port .front{position:relative}
.hd{display:flex;justify-content:space-between;align-items:center}
.no{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--red);display:grid;place-items:center;color:var(--red);font-weight:700;font-size:30px}
.hd .ic{width:64px;height:64px}
.vt{margin:18px 0 6px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.vd{margin:0;font-size:18px;line-height:1.35;color:var(--ink2);min-height:48px}
#stage.port .no,#stage.port .hd .ic{width:72px;height:72px}
#stage.port .vt{font-size:30px}#stage.port .vd{font-size:21px;min-height:0}

.q{margin-top:16px}
.ql{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between}
.ql .mk{letter-spacing:0;text-transform:none;font-size:13px}
.seg{display:flex;gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:11px 6px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer;
  transition:background .2s,color .2s,box-shadow .2s,transform .15s}
.seg button:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.seg button.on{background:#fff;color:var(--red-d);box-shadow:0 2px 8px rgba(27,32,51,.12)}
.seg button.bad{background:var(--red);color:#fff;box-shadow:none}
.seg button.good{background:var(--ok);color:#fff;box-shadow:none}
#stage.port .ql{font-size:15px}#stage.port .ql .mk{font-size:16px}
#stage.port .seg button{font-size:19px;padding:15px 6px}
.hint{margin-top:auto;min-height:44px;padding-top:12px;font-size:14px;line-height:1.35;color:var(--red-d)}
.hint.ok{color:var(--ok)}
#stage.port .hint{font-size:18px;min-height:0;padding-top:16px}

/* back side */
.back .vt{margin-top:0}
.fl{flex:1;display:grid;place-items:center;margin:6px 0}
.fl svg{width:100%;height:auto;overflow:visible}
.fl .bx{fill:#fff;stroke:var(--line);stroke-width:1.5}
.fl .bx.red{fill:var(--red);stroke:var(--red)}
.fl .bx.soft{fill:var(--soft);stroke:none}
.fl text{font-family:'Golos Text','Segoe UI',Arial,sans-serif;font-size:14px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.fl text.w{fill:#fff}.fl text.s{font-size:11.5px;font-weight:500;fill:var(--muted)}
.fl .ln{fill:none;stroke:var(--edge,#B9BEC8);stroke-width:1.6}
.fl .rail{fill:none;stroke:var(--radio);stroke-width:1.4;stroke-dasharray:5 5}
.fl .gate{stroke:var(--red);stroke-width:2.4;stroke-dasharray:3 6;stroke-linecap:round}
.fl .dot{fill:var(--ink);stroke:#fff;stroke-width:2.5}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15.5px;line-height:1.3;border-top:1px solid #F0F1F4;padding-top:14px}
.facts span{color:var(--muted)}.facts b{font-weight:600}
.facts b.r{color:var(--red-d)}
#stage.port .facts{font-size:19px}

.foot{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px}
.status{font-size:17px;color:var(--ink2);min-width:220px;text-align:center}
#stage.port .foot{flex-wrap:wrap;margin-top:26px}
#stage.port .status{font-size:20px;width:100%}
.insight{display:none;margin:18px auto 0;max-width:1100px;text-align:center;font-size:19px;line-height:1.4;color:var(--ink);background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.insight b{color:var(--red-d)}
.insight.show{display:block;animation:rise .5s ease}
#stage.port .insight{font-size:20px}
</style>
</head>

<script>
/* Shared runtime for deck slides: fit-to-frame, toast, confetti, fullscreen, storage, icons */
window.Deck = (() => {
  const fitEl = document.getElementById('fit');
  const st = document.getElementById('stage');
  const LW = 1600, LH = 900, PW = 900;
  let mode = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit() {
    const vw = innerWidth, vh = innerHeight;
    const m = vw / vh < 0.82 ? 'port' : 'land';
    if (m !== mode) {
      mode = m;
      st.classList.toggle('port', m === 'port');
      document.body.classList.toggle('port', m === 'port');
      document.dispatchEvent(new CustomEvent('deck:mode', {detail: m}));
    }
    if (m === 'land') {
      st.style.width = LW + 'px'; st.style.height = LH + 'px';
      const s = Math.min(vw / LW, vh / LH);
      st.style.transform = `translate(${(vw - LW * s) / 2}px, ${(vh - LH * s) / 2}px) scale(${s})`;
      fitEl.style.height = '100%';
    } else {
      st.style.width = PW + 'px'; st.style.height = 'auto';
      const s = vw / PW;
      st.style.transform = `scale(${s})`;
      fitEl.style.height = Math.ceil(st.offsetHeight * s) + 'px';
    }
  }
  addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(() => { if (mode === 'port') fit(); }).observe(st);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // toast
  const toastEl = document.createElement('div');
  toastEl.className = 'toast';
  toastEl.innerHTML = '<div class="em"></div><div><div class="tt"></div><div class="ts"></div></div>';
  document.body.appendChild(toastEl);
  toastEl.addEventListener('click', () => toastEl.classList.remove('show'));
  let tt = null;
  function toast(kind, em, title, text, ms = 6500) {
    toastEl.className = 'toast ' + kind;
    toastEl.querySelector('.em').textContent = em;
    toastEl.querySelector('.tt').textContent = title;
    toastEl.querySelector('.ts').textContent = text;
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), ms);
    if (kind === 'win') confetti();
  }
  function hideToast() { toastEl.classList.remove('show'); }

  // confetti
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  function confetti() {
    if (reduced) return;
    const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#FC3E24', '#16181D', '#FFB4A6', '#1E9E5A', '#C3C7CF', '#FFD166'];
    const ps = Array.from({length: 160}, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .2,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 4,
      w: 6 + Math.random() * 7, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
      c: cols[(Math.random() * cols.length) | 0]
    }));
    const t0 = performance.now();
    const frame = (now) => {
      const el = now - t0;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - el / 2600);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
        ctx.restore();
      });
      if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(frame);
  }

  // fullscreen button (falls back to a new tab where the Fullscreen API is missing, e.g. iPhone)
  const fsBtn = document.createElement('button');
  fsBtn.className = 'fs'; fsBtn.title = 'На весь экран';
  fsBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  st.appendChild(fsBtn);
  fsBtn.addEventListener('click', () => {
    const d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (d.requestFullscreen && document.fullscreenEnabled) d.requestFullscreen().catch(() => open(location.href, '_blank'));
    else open(location.href, '_blank');
  });

  // storage shared by all slides on this origin (slide 29 reads slide 6)
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('t11.' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('t11.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const IC = {
    file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',
    workflow:'<rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
    bot:'<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
    db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
    draft:'<path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M13.38 15.62a1 1 0 0 0-3-3L5 18l-1 4 4-1Z"/>',
    mailc:'<path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><path d="m16 19 2 2 4-4"/>',
    undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
    shieldc:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
    flask:'<path d="M10 2v7.53a2 2 0 0 1-.21.9L4.72 20.55A1 1 0 0 0 5.62 22h12.76a1 1 0 0 0 .9-1.45l-5.07-10.12a2 2 0 0 1-.21-.9V2M8.5 2h7M7 16h10"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    x:'<path d="M18 6 6 18M6 6l12 12"/>',
    copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'
  };
  const svg = (k, cls) => `<svg viewBox="0 0 24 24"${cls ? ` class="${cls}"` : ''}>${IC[k]}</svg>`;

  // entrance animations leave opacity:0 as the base state, so drop the class once played;
  // otherwise a later animation (shake) would replace it and hide the element
  document.addEventListener('animationend', (e) => {
    const t = e.target;
    if (e.animationName === 'rise' && t.classList.contains('anim-rise')) { t.classList.remove('anim-rise'); t.style.animationDelay = ''; }
    if (e.animationName === 'shake') t.classList.remove('shake');
  });
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  requestAnimationFrame(fit);
  return {fit, shake, toast, hideToast, confetti, store, svg, reduced, get mode() { return mode; }};
})();

</script>

   h:{type:'Модель вызывается один раз с готовыми сведениями. Выбирать шаги ей не из чего.',
      step:'Приложение заранее решает, что передать модели. Модель только пишет текст.',
      auth:'Модель ничего не разрешает: приложение решает, какие сведения дать и что делать с ответом.'},
   f:[['Шаг выбирает','код приложения'],['Разрешает','инфраструктура'],['Итого','один вызов LLM']]},
  {t:'Заданный workflow', d:'Код всегда вызывает поиск, CRM и генерацию', ic:'workflow',
   a:{type:'Workflow', step:'Код', auth:'Инфраструктура'},
   h:{type:'Последовательность «поиск → CRM → генерация» зашита в коде, даже если модель участвует в шаге.',
      step:'Переходы задаёт код. Модель внутри шага маршрут не меняет.',
      auth:'Вызов CRM выполняет код с проверкой прав, а не модель.'},
   f:[['Шаг выбирает','код (маршрут задан)'],['Разрешает','инфраструктура'],['Итого','workflow']]},
  {t:'Агент поддержки', d:'Модель выбирает поиск, CRM или уточнение', ic:'bot',
   a:{type:'Агент', step:'Модель', auth:'Инфраструктура'},
   h:{type:'Модель сама выбирает между поиском, CRM и уточнением. Это агентный цикл.',
      step:'Следующий шаг выбирает модель, в заданных пределах.',
      auth:'Модель только предлагает вызов. Разрешение проверяет исполнитель вне модели, как и в других вариантах.'},
   f:[['Шаг выбирает','модель'],['Разрешает','инфраструктура (исполнитель)'],['Итого','агентный цикл']]}
];

const FLOWS = [
  // 1. one call
  `<svg viewBox="0 0 400 200">
    <rect class="bx soft" x="4" y="70" width="104" height="56" rx="10"/><text x="56" y="98">Сведения</text>
    <rect class="bx red" x="148" y="70" width="104" height="56" rx="10"/><text class="w" x="200" y="98">LLM</text>
    <rect class="bx" x="292" y="70" width="104" height="56" rx="10"/><text x="344" y="98">Ответ</text>
    <path class="ln" d="M108 98H146M252 98H290" marker-end="url(#a1)"/>
    <text class="s" x="200" y="150">один проход, без выбора шагов</text>
    <text class="s" x="128" y="84">код</text>
    <circle class="dot" r="7"><animateMotion dur="2.4s" repeatCount="indefinite" path="M56 98H344" keyTimes="0;1" calcMode="linear"/></circle>
    <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#B9BEC8"/></marker></defs>
  </svg>`,
  // 2. workflow
  `<svg viewBox="0 0 400 200">
    <rect class="rail" x="0" y="52" width="400" height="92" rx="14"/>
    <text class="s" x="200" y="40">порядок задан кодом</text>
    <rect class="bx" x="10" y="74" width="80" height="48" rx="10"/><text x="50" y="98">Поиск</text>
    <rect class="bx" x="112" y="74" width="80" height="48" rx="10"/><text x="152" y="98">CRM</text>
    <rect class="bx red" x="214" y="74" width="80" height="48" rx="10"/><text class="w" x="254" y="98">LLM</text>
    <rect class="bx" x="316" y="74" width="76" height="48" rx="10"/><text x="354" y="98">Ответ</text>
    <path class="ln" d="M90 98H110M192 98H212M294 98H314" marker-end="url(#a2)"/>
    <text class="s" x="200" y="166">модель работает внутри шага</text>
    <circle class="dot" r="7"><animateMotion dur="3.2s" repeatCount="indefinite" path="M50 98H354"/></circle>
    <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#B9BEC8"/></marker></defs>
  </svg>`,
  // 3. agent loop
  `<svg viewBox="0 0 400 200">
    <rect class="bx red" x="140" y="6" width="120" height="50" rx="10"/><text class="w" x="200" y="31">LLM</text>
    <rect class="bx" x="300" y="6" width="96" height="50" rx="10"/><text x="348" y="31">Ответ</text>
    <path class="ln" d="M260 31H298" marker-end="url(#a3)"/>
    <path class="ln" d="M180 56L60 138M200 56V138M220 56L340 138" marker-end="url(#a3)"/>
    <line class="gate" x1="4" y1="104" x2="396" y2="104"/>
    <text class="s" x="40" y="94" style="fill:#E0321B">исполнитель</text>
    <rect class="bx" x="10" y="140" width="100" height="46" rx="10"/><text x="60" y="163">Поиск</text>
    <rect class="bx" x="150" y="140" width="100" height="46" rx="10"/><text x="200" y="163">CRM</text>
    <rect class="bx" x="290" y="140" width="100" height="46" rx="10"/><text x="340" y="163">Уточнить</text>
    <path class="ln" d="M120 18a22 22 0 1 1 0 26" marker-end="url(#a3)"/>
    <circle class="dot" r="7"><animateMotion dur="5s" repeatCount="indefinite" path="M200 31L60 160L200 31L200 160L200 31L340 160L200 31L348 31"/></circle>
    <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#B9BEC8"/></marker></defs>
  </svg>`
];

const ans = V.map(() => ({}));
let checked = false;
const grid = document.getElementById('grid');

V.forEach((v, i) => {
  const el = document.createElement('div');
  el.className = 'v anim-rise'; el.style.animationDelay = (.25 + i * .12) + 's';
  el.innerHTML = `<div class="flip">
    <div class="face front card">
      <div class="hd"><div class="no">${i + 1}</div><div class="ic">${Deck.svg(v.ic)}</div></div>
      <div class="vt">${v.t}</div><p class="vd">${v.d}</p>
      ${Q.map(q => `<div class="q" data-q="${q.k}"><div class="ql">${q.l}<span class="mk"></span></div>
        <div class="seg">${q.o.map(o => `<button data-o="${o}">${o}</button>`).join('')}</div></div>`).join('')}
      <div class="hint"></div>
    </div>
    <div class="face back card">
      <div class="hd" style="margin-bottom:14px"><div class="no">${i + 1}</div><div class="ic">${Deck.svg(v.ic)}</div></div>
      <div class="vt">${v.t}</div>
      <div class="fl">${FLOWS[i]}</div>
      <div class="facts">${v.f.map(([a, b], j) => `<span>${a}</span><b class="${j === 1 ? 'r' : ''}">${b}</b>`).join('')}</div>
    </div></div>`;
  el.querySelectorAll('.q').forEach(qEl => {
    const k = qEl.dataset.q;
    qEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      ans[i][k] = b.dataset.o;
      qEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      qEl.querySelectorAll('button').forEach(x => x.classList.remove('bad', 'good'));
      qEl.querySelector('.mk').textContent = '';
      update();
    }));
  });
  grid.appendChild(el);
});
const cards = [...grid.children];

function count() { return ans.reduce((n, a) => n + Object.keys(a).length, 0); }
function update() {
  const n = count();
  document.getElementById('check').disabled = n < 9;
  if (!checked || n < 9) document.getElementById('status').textContent = `Ответов: ${n} из 9`;
}

document.getElementById('check').addEventListener('click', () => {
  // Snapshot answers at the first Check click, before visual correction.
  if(window.TrainingAPI) window.TrainingAPI.submit('s11','main',{answers:Object.fromEntries(ans.map((a,i)=>['v'+(i+1),{...a}]))});
  checked = true;
  let right = 0;
  V.forEach((v, i) => {
    const c = cards[i]; let firstWrong = null;
    Q.forEach(q => {
      const qEl = c.querySelector(`[data-q="${q.k}"]`);
      const ok = ans[i][q.k] === v.a[q.k];
      const b = qEl.querySelector(`button[data-o="${ans[i][q.k]}"]`);
      b.classList.remove('on'); b.classList.add(ok ? 'good' : 'bad');
      qEl.querySelector('.mk').innerHTML = ok ? '<span style="color:var(--ok)">✓ верно</span>' : '<span style="color:var(--red-d)">✗ подумайте ещё</span>';
      if (ok) right++; else if (!firstWrong) firstWrong = q.k;
    });
    const h = c.querySelector('.hint');
    h.className = 'hint' + (firstWrong ? '' : ' ok');
    h.textContent = firstWrong ? v.h[firstWrong] : 'Всё верно';
    if (firstWrong) Deck.shake(c);
  });
  document.getElementById('status').textContent = right === 9 ? 'Верно 9 из 9' : `Верно ${right} из 9. Исправьте красные и проверьте снова`;
  document.getElementById('flipAll').style.display = '';
  if (right === 9) {
    Deck.toast('win', '🔥', 'Красавчик!', 'Все три варианта разобраны верно. Обратите внимание: действие везде разрешает инфраструктура.');
    document.getElementById('status').innerHTML = 'Во всех трёх вариантах <b style="color:var(--red-d)">действие разрешает инфраструктура</b>. Меняется только то, кто выбирает шаг.';
    cards.forEach((c, i) => setTimeout(() => setFlip(c, true), 900 + i * 260));
  } else {
    const authWrong = V.some((v, i) => ans[i].auth !== v.a.auth);
    Deck.toast('lose', '🤔', `Верно ${right} из 9`, authWrong
      ? 'Подсказка: модель может выбрать операцию, но может ли она её разрешить?'
      : 'Почти! Исправьте красные ответы и проверьте снова.', 4500);
  }
});

// two-phase flip (turn to edge, swap faces, turn back): no backface-visibility, renders everywhere
function setFlip(c, on) {
  if (c.classList.contains('flipped') === on) return;
  c.classList.add('turning');
  setTimeout(() => {
    c.classList.toggle('flipped', on);
    c.classList.remove('turning');
    syncFlipBtn(); Deck.fit();
  }, Deck.reduced ? 0 : 320);
}
function syncFlipBtn() {
  const all = cards.every(c => c.classList.contains('flipped'));
  document.getElementById('flipAll').textContent = all ? 'Вернуться к ответам' : 'Показать схемы';
}
document.getElementById('flipAll').addEventListener('click', () => {
  const all = cards.every(c => c.classList.contains('flipped'));
  cards.forEach((c, i) => setTimeout(() => setFlip(c, !all), i * 160));
});
// tap a flipped card to turn it back
cards.forEach(c => c.querySelector('.back').addEventListener('click', () => setFlip(c, false)));
})();
</script>
